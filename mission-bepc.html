<title>Mission BEPC</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap");
:root{
  --papier:#F3F6FA; --carte:#FFFFFF; --grille:#E3EAF3; --encre:#18283A; --encre-2:#5A6B7E; --trait:#D5DEE9;
  --orange:#E0701F; --orange-doux:#FDEBDD; --vert:#1A8F5F; --vert-doux:#DDF3E9; --rouge:#CF3F35; --rouge-doux:#FBE3E0;
  --bleu:#2B63B8; --bleu-doux:#E1EBF8; --or:#C9941A;
  --titre:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --texte:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--papier:#0F1722;--carte:#172232;--grille:#1B2839;--encre:#E6EDF6;--encre-2:#9AAABD;--trait:#2A3A4F;
  --orange:#F28C3A;--orange-doux:#3A2515;--vert:#3CC48A;--vert-doux:#133326;--rouge:#EF6B60;--rouge-doux:#3A1C1A;--bleu:#6C9BE8;--bleu-doux:#18263B;--or:#E3B347}}
:root[data-theme="dark"]{color-scheme:dark;--papier:#0F1722;--carte:#172232;--grille:#1B2839;--encre:#E6EDF6;--encre-2:#9AAABD;--trait:#2A3A4F;
  --orange:#F28C3A;--orange-doux:#3A2515;--vert:#3CC48A;--vert-doux:#133326;--rouge:#EF6B60;--rouge-doux:#3A1C1A;--bleu:#6C9BE8;--bleu-doux:#18263B;--or:#E3B347}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papier);color:var(--encre);font-family:var(--texte);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grille) 1px,transparent 1px),linear-gradient(90deg,var(--grille) 1px,transparent 1px);background-size:22px 22px;
  -webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bleu);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--titre);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px}
p{margin:0}
.ecran{display:flex;flex-direction:column;gap:14px;padding-block:14px 8px}

/* En-tête */
.tete{display:flex;align-items:center;gap:12px;padding-top:6px}
.avatar{width:48px;height:48px;border-radius:14px;background:var(--orange);color:#fff;font-family:var(--titre);font-size:22px;display:grid;place-items:center;flex:none}
.tete .qui{flex:1;min-width:0}
.tete .qui b{font-family:var(--titre);font-size:22px;display:block;line-height:1.1}
.tete .qui small{color:var(--encre-2);font-weight:700}
.serie{display:flex;align-items:center;gap:4px;font-family:var(--titre);font-size:20px;color:var(--orange);background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:4px 10px}
.serie svg{width:18px;height:18px}
.barre-xp{height:10px;background:var(--trait);border-radius:99px;overflow:hidden}
.barre-xp i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--or));border-radius:99px}
.xp-info{display:flex;justify-content:space-between;font-size:13px;color:var(--encre-2);font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}

/* Cartes */
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:16px;padding:16px}
.mission{background:var(--orange);color:#fff;border:0;border-radius:18px;padding:18px;text-align:left;cursor:pointer;display:grid;gap:4px;box-shadow:0 6px 0 #b35412}
.mission:active{transform:translateY(3px);box-shadow:0 3px 0 #b35412}
.mission b{font-family:var(--titre);font-size:24px}
.mission span{opacity:.92;font-weight:600}
.mission.faite{background:var(--vert);box-shadow:0 6px 0 #11653f}
.etiquette{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--encre-2)}
.grille-mat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mat{background:var(--carte);border:1px solid var(--trait);border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:6px;min-height:104px}
.mat b{font-family:var(--titre);font-size:18px;line-height:1.1}
.mat small{color:var(--encre-2);font-weight:700}
.mat .icone{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--titre);font-size:18px;color:#fff}
.mat.bientot{opacity:.62}
.mat .mini{height:6px;background:var(--trait);border-radius:99px;overflow:hidden}
.mat .mini i{display:block;height:100%;background:var(--vert)}

/* Chapitres */
.chap{display:flex;gap:12px;align-items:center;background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.chap .num{width:38px;height:38px;border-radius:11px;background:var(--bleu-doux);color:var(--bleu);font-family:var(--titre);font-size:18px;display:grid;place-items:center;flex:none}
.chap.maitrise .num{background:var(--vert);color:#fff}
.chap .txt{flex:1;min-width:0;display:grid;gap:2px}
.chap .txt b{font-family:var(--titre);font-size:17px;line-height:1.15}
.chap .txt small{color:var(--encre-2);font-weight:700;font-size:13px}
.chap .etoiles{color:var(--or);font-size:15px;letter-spacing:1px;white-space:nowrap}
.chap.verrou{cursor:default;opacity:.55}
.pastille{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:1px 7px;background:var(--orange-doux);color:var(--orange)}
.pastille.vert{background:var(--vert-doux);color:var(--vert)}
.liste{display:grid;gap:8px}

/* Chapitre : cours et niveaux */
.retour{align-self:flex-start;background:none;border:0;color:var(--bleu);font-weight:800;cursor:pointer;padding:4px 0}
details.cours{background:var(--carte);border:1px solid var(--trait);border-radius:16px;overflow:hidden}
details.cours summary{cursor:pointer;padding:14px 16px;font-family:var(--titre);font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.cours summary::-webkit-details-marker{display:none}
details.cours summary::after{content:"Lire";font-family:var(--texte);font-size:13px;font-weight:800;color:var(--bleu)}
details.cours[open] summary::after{content:"Fermer"}
.cours-corps{padding:0 16px 16px;display:grid;gap:10px}
.regle{border-left:4px solid var(--bleu);background:var(--bleu-doux);border-radius:0 10px 10px 0;padding:10px 12px}
.regle > b:first-child{display:block;font-family:var(--titre);font-size:16px}
.niveau{display:flex;align-items:center;gap:12px;background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;cursor:pointer;width:100%;text-align:left}
.niveau .rond{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--titre);font-size:18px;flex:none;background:var(--trait);color:var(--encre-2)}
.niveau.ouvert .rond{background:var(--orange);color:#fff}
.niveau.reussi .rond{background:var(--vert);color:#fff}
.niveau.ferme{opacity:.5;cursor:default}
.niveau .txt{flex:1;display:grid}
.niveau .txt b{font-family:var(--titre);font-size:17px}
.niveau .txt small{color:var(--encre-2);font-weight:700;font-size:13px}
.bouton{border:0;border-radius:14px;padding:13px 16px;font-family:var(--titre);font-size:18px;cursor:pointer;background:var(--bleu);color:#fff}
.bouton.second{background:var(--carte);color:var(--bleu);border:2px solid var(--bleu)}
.bouton.vert{background:var(--vert)}
.bouton:disabled{opacity:.45;cursor:default}

/* Exercice */
.exo-haut{display:flex;align-items:center;gap:10px}
.exo-haut .quitter{background:none;border:0;font-size:22px;cursor:pointer;color:var(--encre-2);padding:2px 6px}
.progress{flex:1;height:12px;background:var(--trait);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--vert);transition:width .3s}
.exo-titre{color:var(--encre-2);font-weight:800;font-size:13px}
.question{font-size:18px;line-height:1.55}
.calc{font-size:22px;text-align:center;margin:10px 0 4px;font-weight:700}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.92em}
.fr > span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr > span:last-child{padding:0 3px}
.rad{border-top:2px solid currentColor;padding:0 2px}
.figure{width:100%;max-width:320px;margin:0 auto;display:block}
.figure .tri{fill:none;stroke:var(--encre);stroke-width:2}
.figure .para{stroke:var(--orange);stroke-width:2.5}
.figure .pt{font-family:var(--titre);font-size:17px;fill:var(--encre)}
.figure .pt-c{fill:var(--encre)}
.figure .lg{font-size:13px;font-weight:800;fill:var(--bleu)}
.reponse{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:700}
.case{width:88px;height:48px;border:2px solid var(--trait);border-radius:12px;background:var(--carte);text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.case.active{border-color:var(--bleu);box-shadow:0 0 0 3px var(--bleu-doux)}
.case.petite{width:64px}
.choix{display:grid;gap:8px}
.choix button{border:2px solid var(--trait);background:var(--carte);border-radius:14px;padding:12px 14px;font-size:18px;font-weight:700;cursor:pointer;text-align:center}
.choix button[aria-pressed="true"]{border-color:var(--bleu);background:var(--bleu-doux)}
.choix button.juste{border-color:var(--vert);background:var(--vert-doux)}
.choix button.faux{border-color:var(--rouge);background:var(--rouge-doux)}
.pave{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.pave button{height:50px;border:0;border-radius:12px;background:var(--carte);border:1px solid var(--trait);font-size:21px;font-weight:800;cursor:pointer;touch-action:manipulation}
.pave button.gris{background:var(--grille)}
.pave button:active{transform:scale(.96)}
.retour-exo{border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.retour-exo.bien{background:var(--vert-doux);border:2px solid var(--vert)}
.retour-exo.mal{background:var(--rouge-doux);border:2px solid var(--rouge)}
.retour-exo h3{color:var(--vert)}
.retour-exo.mal h3{color:var(--rouge)}
.retour-exo .expl{font-size:15.5px;line-height:1.55}
.message{color:var(--rouge);font-weight:800;text-align:center;min-height:1.4em;font-size:14px}

/* Fin de session */
.fin{text-align:center;display:grid;gap:12px;justify-items:center}
.fin .score{font-family:var(--titre);font-size:56px;line-height:1}
.fin .etoiles{font-size:40px;color:var(--or);letter-spacing:6px}
.gain{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gain span{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:6px 12px;font-weight:800}
.badge-nouveau{background:var(--orange-doux);border:2px dashed var(--orange);border-radius:14px;padding:10px 14px;font-weight:800;color:var(--orange)}
.actions{display:grid;gap:8px;width:100%}

/* Progrès */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:10px;text-align:center}
.stat b{font-family:var(--titre);font-size:26px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--encre-2);font-weight:700;font-size:12px}
.ligne-comp{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:10px;align-items:center;font-size:14.5px;font-weight:700}
.ligne-comp .mini{height:8px;background:var(--trait);border-radius:99px;overflow:hidden}
.ligne-comp .mini i{display:block;height:100%}
.ligne-comp span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--encre-2)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.badge{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:10px 6px;text-align:center;font-size:12.5px;font-weight:800;display:grid;gap:4px;justify-items:center}
.badge .medaille{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--titre);font-size:18px;background:var(--trait);color:var(--encre-2)}
.badge.gagne .medaille{background:var(--or);color:#fff}
.badge:not(.gagne){opacity:.55}

/* Navigation du bas */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--carte);border-top:1px solid var(--trait);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav div{max-width:640px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:9px 2px 11px;font-weight:800;font-size:12px;color:var(--encre-2);cursor:pointer;display:grid;justify-items:center;gap:2px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--orange)}
.cache,[hidden]{display:none!important}
:root{--zoom:1}
.app,.nav{zoom:var(--zoom)}
.ecran{width:100%;max-width:720px;margin-inline:auto}
.ecran.large{max-width:none}
@media (prefers-reduced-motion:no-preference){.ecran{animation:entree .22s ease-out}@keyframes entree{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
.ecran > .retour:first-child{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin-inline:-16px;width:calc(100% + 32px);padding:12px 16px;background:color-mix(in srgb,var(--papier) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--trait);text-align:left;font-size:15px}
.recherche-faux{display:flex;align-items:center;gap:10px;width:100%;background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;color:var(--encre-2);font-weight:700;cursor:pointer;text-align:left}
.recherche-faux svg,.champ-recherche svg{width:20px;height:20px;flex:none}
.champ-recherche{display:flex;align-items:center;gap:10px;background:var(--carte);border:2px solid var(--bleu);border-radius:14px;padding:4px 14px;color:var(--bleu)}
.champ-recherche input{flex:1;min-width:0;border:0;background:none;font-size:17px;padding:10px 0;outline:none;color:var(--encre)}
.idees{display:flex;flex-wrap:wrap;gap:8px}
.idees button{border:1px solid var(--trait);background:var(--carte);border-radius:99px;padding:7px 13px;font-weight:700;cursor:pointer}
.accueil-grille{display:grid;gap:14px}
.accueil-grille .col{display:grid;gap:10px;align-content:start}
.reprendre{display:flex;align-items:center;gap:12px;background:var(--carte);border:1px solid var(--trait);border-left:5px solid var(--c);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.reprendre .icone{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--titre);font-size:18px;flex:none}
.reprendre .txt{flex:1;min-width:0;display:grid}
.reprendre .txt b{font-family:var(--titre);font-size:18px;line-height:1.15}
.reprendre small{color:var(--encre-2);font-weight:700;font-size:12.5px}
.reprendre .fleche,.carte-mini::after{color:var(--c);font-weight:800;font-size:22px}
.carte-mini{position:relative;display:grid;gap:2px;background:var(--carte);border:1px solid var(--trait);border-top:4px solid var(--c);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.carte-mini .etiquette{color:var(--c);font-size:11px}
.carte-mini b{font-family:var(--titre);font-size:16px;line-height:1.15}
.carte-mini small{color:var(--encre-2);font-weight:700;font-size:12.5px}
.deux-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.titre-section{display:flex;justify-content:space-between;align-items:center}
.lien{background:none;border:0;color:var(--bleu);font-weight:800;cursor:pointer;padding:4px 0}
.mat{border-top:4px solid var(--c)}
.mat-haut{display:flex;justify-content:space-between;align-items:center}
.anneau{flex:none}
.grille-matieres{display:grid;gap:10px}
.carte-matiere{display:flex;gap:12px;align-items:center;background:var(--carte);border:1px solid var(--trait);border-left:5px solid var(--c);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.carte-matiere .icone{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:19px;flex:none;font-family:var(--titre)}
.carte-matiere .txt{flex:1;min-width:0;display:grid;gap:1px}
.carte-matiere .txt b{font-family:var(--titre);font-size:18px;line-height:1.15}
.carte-matiere small{color:var(--encre-2);font-weight:700;font-size:13px}
.bandeau{display:flex;align-items:center;gap:14px;background:var(--c);color:#fff;border-radius:18px;padding:16px}
.bandeau .icone{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-family:var(--titre);font-size:24px;flex:none}
.bandeau div{flex:1;min-width:0}
.bandeau h2{color:#fff}
.bandeau p{opacity:.92;font-weight:700;font-size:14px}
.chap{border-left:4px solid var(--c,var(--bleu))}
.chap .mini{height:5px;background:var(--trait);border-radius:99px;overflow:hidden;margin-top:4px}
.chap .mini i{display:block;height:100%}
.etiquette.pleine{grid-column:1 / -1;margin-top:6px}
.titre-chap{display:grid;gap:6px}
.pastille-mat{justify-self:start;background:var(--c);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800}
.onglets{position:sticky;top:calc(env(safe-area-inset-top,0px) + 47px);z-index:3;display:flex;gap:4px;background:var(--grille);border-radius:14px;padding:4px}
.onglets button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:800;cursor:pointer;color:var(--encre-2)}
.onglets button[aria-selected="true"]{background:var(--carte);color:var(--encre);box-shadow:0 1px 3px rgba(0,0,0,.12);border-bottom:3px solid var(--c)}
.panneau{display:grid;gap:12px}
.panneau .cours-corps{padding:16px}
.reglage{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.segments{display:flex;background:var(--grille);border-radius:12px;padding:3px;gap:3px}
.segments button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:800;cursor:pointer;color:var(--encre-2)}
.segments button[aria-pressed="true"]{background:var(--carte);color:var(--encre);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (min-width:760px){
  .accueil-grille{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  .grille-mat{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grille-matieres,.liste.grille2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vignettes{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:1000px){.grille-mat{grid-template-columns:repeat(6,minmax(0,1fr))}.grille-matieres{grid-template-columns:repeat(3,minmax(0,1fr))}}
.actions-q{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.actions-q #btn-indice{padding-inline:14px}
.actions-q #btn-indice.cache + #verifier, .actions-q #verifier:only-child{grid-column:1 / -1}
.indice{background:#FFF7E0;border:2px solid var(--or);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.55}
:root[data-theme="dark"] .indice{background:#3a300f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .indice{background:#3a300f}}
.sec{display:grid;gap:4px;padding-top:10px;border-top:1px dashed var(--trait)}
.sec > span{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--encre-2)}
.sec p{margin:0}
.ta-rep{color:var(--rouge);font-weight:700}
.bonne-rep{color:var(--vert);font-weight:800}
.piege-sec p{color:var(--orange);font-weight:700}
.retour-exo details .sec:first-of-type{margin-top:8px}
.exemple{border-color:var(--vert)}
.ex-enonce{font-weight:700;line-height:1.55}
.etapes{margin:0;padding-left:22px;display:grid;gap:8px;line-height:1.55}
.piege{background:var(--orange-doux);border-radius:10px;padding:10px 12px}
.piege b{display:block;color:var(--orange)}
.document{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--bleu);border-radius:12px;padding:12px 14px;display:grid;gap:6px;line-height:1.6}
.document .vocab td{font-size:14px}
.auto-eval{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.auto-eval button{border:2px solid var(--trait);background:var(--carte);border-radius:10px;padding:8px 4px;font-weight:800;font-size:13.5px;cursor:pointer}
.auto-eval button[aria-pressed="true"]{border-color:var(--bleu);background:var(--bleu-doux)}
.corrige{border-top:2px solid var(--vert);padding-top:10px}
.scene{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--trait);background:#fff}
.scene-mini svg{max-width:300px;margin:0 auto}
.vignettes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vignette{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:6px;cursor:pointer;display:grid;gap:6px;text-align:left}
.vignette .scene{border:0;border-radius:10px}
.vignette b{font-family:var(--titre);font-size:15px}
.texte-rep{width:100%;border:2px solid var(--trait);border-radius:12px;background:var(--carte);padding:12px;font-size:18px;line-height:1.5;resize:vertical}
.texte-rep:focus{border-color:var(--bleu);outline:none;box-shadow:0 0 0 3px var(--bleu-doux)}
mark.faute{background:var(--rouge-doux);color:var(--rouge);font-weight:800;border-bottom:2px solid var(--rouge);padding:0 2px;border-radius:3px}
.theme-carte{display:flex;gap:12px;align-items:center;background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.theme-carte .icone{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
.theme-carte .txt{flex:1;min-width:0;display:grid;gap:2px}
.theme-carte .txt b{font-family:var(--titre);font-size:17px;line-height:1.15}
.theme-carte .txt small{color:var(--encre-2);font-weight:700;font-size:13px}
.faits{margin:0;padding-left:20px;display:grid;gap:8px}
.bloc{background:var(--carte);border:1px solid var(--trait);border-radius:16px;overflow:hidden}
.bloc summary{cursor:pointer;padding:14px 16px;font-family:var(--titre);font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bloc summary::-webkit-details-marker{display:none}
.bloc summary::after{content:"+";font-size:24px;color:var(--bleu);line-height:1}
.bloc[open] summary::after{content:"−"}
.bloc .corps{padding:0 16px 16px;display:grid;gap:10px}
.bloc h4{margin:0;font-family:var(--titre);font-size:16px;color:var(--bleu)}
.bloc ul{margin:0;padding-left:20px;display:grid;gap:4px}
.vocab{width:100%;border-collapse:collapse;font-size:15px}
.vocab td{padding:7px 4px;border-bottom:1px solid var(--trait);vertical-align:middle}
.vocab td:nth-child(2){font-weight:800;color:var(--bleu)}
.vocab td:last-child{width:44px;text-align:right}
.ecouter{border:0;background:var(--bleu-doux);color:var(--bleu);border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.ecouter.mini{padding:5px 8px}
.ecouter svg{width:16px;height:16px}
.modele{background:var(--papier);border-radius:12px;padding:12px;font-size:15.5px;line-height:1.6}
.sujet{font-weight:800}
.plan{margin:0;padding-left:20px;display:grid;gap:4px}
.sources{font-size:13px;color:var(--encre-2)}
.sources a{color:var(--bleu)}
.lien-actu{display:flex;align-items:center;gap:12px;background:var(--carte);border:2px solid #D1495B;border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.lien-actu b{font-family:var(--titre);font-size:17px}
.lien-actu small{color:var(--encre-2);font-weight:700}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}

<script>
(function () {
  "use strict";
  const PRENOM = "Adriel", NOM_COMPLET = "Adriel";

  const N = (id, nom, n, seuil, gens, info) => ({ id, nom, n, seuil, gens, info });
  // =========================================================
  // Outils mathématiques
  // =========================================================
  const hasard = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const parmi = l => l[Math.floor(Math.random() * l.length)];
  const nonNul = (a, b) => { let x = 0; while (x === 0) x = hasard(a, b); return x; };
  const pgcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const melanger = l => { const c = [...l]; for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; };
  const moins = n => (n < 0 ? "−" + Math.abs(n) : String(n));                 // vrai signe moins
  const par = n => (n < 0 ? "(" + moins(n) + ")" : String(n));               // parenthèses si négatif
  const signe = n => (n < 0 ? " − " + Math.abs(n) : " + " + n);               // « + 3 » ou « − 3 »
  function reduireFrac(n, d) { if (d < 0) { n = -n; d = -d; } const g = pgcd(n, d); return [n / g, d / g]; }
  function fracTexte(n, d) { [n, d] = reduireFrac(n, d); return d === 1 ? moins(n) : moins(n) + "/" + d; }
  function fracHtml(n, d) {
    [n, d] = reduireFrac(n, d);
    if (d === 1) return moins(n);
    return (n < 0 ? "−" : "") + `<span class="fr"><span>${Math.abs(n)}</span><span>${d}</span></span>`;
  }
  const fr = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
  const rac = x => `√<span class="rad">${x}</span>`;
  // ax² + bx + c écrit proprement
  function poly(a, b, c, v = "x") {
    const t = [];
    if (a) t.push((a === 1 ? "" : a === -1 ? "−" : moins(a)) + v + "²");
    if (b) t.push((t.length ? (b < 0 ? " − " : " + ") : (b < 0 ? "−" : "")) + (Math.abs(b) === 1 ? "" : Math.abs(b)) + v);
    if (c || !t.length) t.push((t.length ? (c < 0 ? " − " : " + ") : (c < 0 ? "−" : "")) + Math.abs(c));
    return t.join("");
  }
  const lin = (a, b, v = "x") => poly(0, a, b, v);                           // ax + b
  function lireNombre(s) {
    if (s == null) return NaN;
    s = String(s).replace(/\s/g, "").replace(/−/g, "-").replace(/,/g, ".");
    if (!s) return NaN;
    if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)) { const [a, b] = s.split("/").map(Number); return b ? a / b : NaN; }
    return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
  }
  const egal = (a, b) => Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(b));
  const carreLibre = m => { for (let k = 2; k * k <= m; k++) if (m % (k * k) === 0) return false; return true; };

  // Une question : { comp (compétence), enonce, type, reponse, explication, figure?, choix?, modele? }
  // types : "nombre" | "deux" (deux solutions) | "qcm" | "coeffs" (plusieurs cases dans un modèle)

  // =========================================================
  // Bases de 4e
  // =========================================================
  const B = {
    fractions() {
      const b = parmi([2, 3, 4, 5, 6]), d = parmi([3, 4, 6, 8, 9, 10].filter(x => x !== b));
      const a = nonNul(1, b + 3), c = nonNul(1, d + 3), op = parmi(["+", "−"]);
      const n = op === "+" ? a * d + c * b : a * d - c * b, den = b * d;
      return { comp: "b-fractions", enonce: `Calcule et donne le résultat sous forme de fraction simplifiée :<div class="calc">${fr(a, b)} ${op} ${fr(c, d)}</div>`,
        type: "nombre", reponse: n / den, affiche: fracTexte(n, den),
        explication: `On met au même dénominateur ${den} : ${fr(a * d, den)} ${op} ${fr(c * b, den)} = ${fr(n, den)}, puis on simplifie : <b>${fracHtml(n, den)}</b>.` };
    },
    relatifs() {
      const a = nonNul(-9, 9), b = nonNul(-9, 9), c = nonNul(-12, 12);
      const r = a * b - c;
      return { comp: "b-relatifs", enonce: `Calcule :<div class="calc">${moins(a)} × ${par(b)} − ${par(c)}</div>`, type: "nombre", reponse: r, affiche: moins(r),
        explication: `On commence par la multiplication : ${moins(a)} × ${par(b)} = ${moins(a * b)}. Puis ${moins(a * b)} − ${par(c)} = ${moins(a * b)} ${c < 0 ? "+ " + Math.abs(c) : "− " + c} = <b>${moins(r)}</b>.` };
    },
    priorites() {
      const a = hasard(2, 20), b = hasard(2, 9), c = hasard(2, 9), d = hasard(1, 15);
      const r = a + b * c - d;
      return { comp: "b-priorites", enonce: `Calcule en respectant les priorités :<div class="calc">${a} + ${b} × ${c} − ${d}</div>`, type: "nombre", reponse: r, affiche: moins(r),
        explication: `La multiplication passe avant : ${b} × ${c} = ${b * c}. Puis ${a} + ${b * c} − ${d} = <b>${moins(r)}</b>.` };
    },
    equation() {
      const a = nonNul(-6, 7), x = nonNul(-8, 8), b = hasard(-12, 12), c = a * x + b;
      return { comp: "b-equation", enonce: `Résous l'équation :<div class="calc">${lin(a, b)} = ${moins(c)}</div>x = ?`, type: "nombre", reponse: x, affiche: moins(x),
        explication: `${lin(a, 0)} = ${moins(c)} ${b < 0 ? "+ " + Math.abs(b) : "− " + b} = ${moins(c - b)}, donc x = ${fr(moins(c - b), par(a))} = <b>${moins(x)}</b>.` };
    },
    developper() {
      const k = nonNul(-6, 7), a = nonNul(-9, 9);
      return { comp: "b-developper", enonce: `Développe et réduis :<div class="calc">${moins(k)}(x${signe(a)})</div>`, type: "coeffs",
        modele: ["", "x +", ""], reponse: [k, k * a], affiche: lin(k, k * a),
        explication: `On distribue ${moins(k)} : ${moins(k)} × x + ${moins(k)} × ${par(a)} = <b>${lin(k, k * a)}</b>.` };
    },
    puissances10() {
      const a = hasard(-6, 8), b = hasard(-6, 8);
      return { comp: "b-puissances", enonce: `Complète :<div class="calc">10<sup>${moins(a)}</sup> × 10<sup>${moins(b)}</sup> = 10<sup>?</sup></div>`, type: "nombre", reponse: a + b, affiche: moins(a + b),
        explication: `On additionne les exposants : ${moins(a)} + ${par(b)} = <b>${moins(a + b)}</b>.` };
    }
  };

  // =========================================================
  // Leçon 1 : Calcul littéral
  // =========================================================
  const L = {
    puissances() {
      const a = parmi([2, 3, 5, 7]), m = nonNul(-5, 6), n = nonNul(-5, 6);
      const cas = hasard(0, 2);
      if (cas === 0) return { comp: "l-puissances", enonce: `Complète :<div class="calc">${a}<sup>${moins(m)}</sup> × ${a}<sup>${moins(n)}</sup> = ${a}<sup>?</sup></div>`, type: "nombre", reponse: m + n, affiche: moins(m + n),
        explication: `a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup> : ${moins(m)} + ${par(n)} = <b>${moins(m + n)}</b>.` };
      if (cas === 1) return { comp: "l-puissances", enonce: `Complète :<div class="calc">${fr(a + "<sup>" + moins(m) + "</sup>", a + "<sup>" + moins(n) + "</sup>")} = ${a}<sup>?</sup></div>`, type: "nombre", reponse: m - n, affiche: moins(m - n),
        explication: `${fr("a<sup>m</sup>", "a<sup>n</sup>")} = a<sup>m−n</sup> : ${moins(m)} − ${par(n)} = <b>${moins(m - n)}</b>.` };
      const p = hasard(2, 4);
      return { comp: "l-puissances", enonce: `Complète :<div class="calc">(${a}<sup>${moins(m)}</sup>)<sup>${p}</sup> = ${a}<sup>?</sup></div>`, type: "nombre", reponse: m * p, affiche: moins(m * p),
        explication: `(a<sup>m</sup>)<sup>n</sup> = a<sup>m×n</sup> : ${moins(m)} × ${p} = <b>${moins(m * p)}</b>.` };
    },
    puissanceNegative() {
      const a = parmi([2, 3, 4, 5, 10]), n = hasard(1, 3), v = Math.pow(a, n);
      return { comp: "l-puissances", enonce: `Écris sous forme de fraction :<div class="calc">${a}<sup>−${n}</sup></div>`, type: "nombre", reponse: 1 / v, affiche: "1/" + v,
        explication: `a<sup>−n</sup> = ${fr(1, "a<sup>n</sup>")}, donc ${a}<sup>−${n}</sup> = ${fr(1, a + "<sup>" + n + "</sup>")} = <b>${fr(1, v)}</b>.` };
    },
    valeur() {
      const a = nonNul(-4, 4), b = hasard(-6, 6), c = hasard(-9, 9), x = nonNul(-4, 4);
      const r = a * x * x + b * x + c;
      return { comp: "l-valeur", enonce: `Calcule la valeur de <b>${poly(a, b, c)}</b> pour <b>x = ${moins(x)}</b>.`, type: "nombre", reponse: r, affiche: moins(r),
        explication: `On remplace x par ${par(x)} : ${moins(a)} × ${par(x)}² ${b ? (b < 0 ? "− " + Math.abs(b) : "+ " + b) + " × " + par(x) : ""} ${c ? signe(c) : ""} = ${moins(a)} × ${x * x}${b ? signe(b * x) : ""}${c ? signe(c) : ""} = <b>${moins(r)}</b>.<br>Attention : ${par(x)}² = ${x * x}, un carré est toujours positif.` };
    },
    identites() {
      const a = hasard(1, 9), k = hasard(1, 4), cas = hasard(0, 3);
      if (cas === 0) return { comp: "l-developper", enonce: `Développe et réduis :<div class="calc">(${k === 1 ? "" : k}x + ${a})²</div>`, type: "coeffs", modele: ["", "x² +", "x +", ""],
        reponse: [k * k, 2 * k * a, a * a], affiche: poly(k * k, 2 * k * a, a * a),
        explication: `(a + b)² = a² + 2ab + b² avec a = ${k === 1 ? "x" : k + "x"} et b = ${a} : ${k === 1 ? "x²" : "(" + k + "x)²"} + 2 × ${k === 1 ? "x" : k + "x"} × ${a} + ${a}² = <b>${poly(k * k, 2 * k * a, a * a)}</b>.` };
      if (cas === 1) return { comp: "l-developper", enonce: `Développe et réduis :<div class="calc">(${k === 1 ? "" : k}x − ${a})²</div>`, type: "coeffs", modele: ["", "x² +", "x +", ""],
        reponse: [k * k, -2 * k * a, a * a], affiche: poly(k * k, -2 * k * a, a * a),
        explication: `(a − b)² = a² − 2ab + b² : ${k === 1 ? "x²" : "(" + k + "x)²"} − 2 × ${k === 1 ? "x" : k + "x"} × ${a} + ${a}² = <b>${poly(k * k, -2 * k * a, a * a)}</b>.` };
      if (cas === 2) return { comp: "l-developper", enonce: `Développe et réduis :<div class="calc">(${k === 1 ? "" : k}x + ${a})(${k === 1 ? "" : k}x − ${a})</div>`, type: "coeffs", modele: ["", "x² +", "x +", ""],
        reponse: [k * k, 0, -a * a], affiche: poly(k * k, 0, -a * a),
        explication: `(a + b)(a − b) = a² − b² : ${k === 1 ? "x²" : "(" + k + "x)²"} − ${a}² = <b>${poly(k * k, 0, -a * a)}</b>. Le terme en x vaut 0.` };
      const b = nonNul(-7, 7), c = nonNul(-7, 7);
      return { comp: "l-developper", enonce: `Développe et réduis :<div class="calc">(x${signe(b)})(x${signe(c)})</div>`, type: "coeffs", modele: ["", "x² +", "x +", ""],
        reponse: [1, b + c, b * c], affiche: poly(1, b + c, b * c),
        explication: `On distribue chaque terme : x × x + x × ${par(c)} + ${moins(b)} × x + ${moins(b)} × ${par(c)} = x² ${signe(c)}x ${signe(b)}x ${signe(b * c)} = <b>${poly(1, b + c, b * c)}</b>.` };
    },
    factoriserIdentite() {
      const a = hasard(2, 9), k = hasard(1, 3), cas = hasard(0, 2);
      const X = k === 1 ? "x" : k + "x";
      let expr, bon, faux;
      if (cas === 0) { expr = poly(k * k, 2 * k * a, a * a); bon = `(${X} + ${a})²`; faux = [`(${X} − ${a})²`, `(${X} + ${a})(${X} − ${a})`, `(${X} + ${2 * a})²`]; }
      else if (cas === 1) { expr = poly(k * k, -2 * k * a, a * a); bon = `(${X} − ${a})²`; faux = [`(${X} + ${a})²`, `(${X} + ${a})(${X} − ${a})`, `(${X} − ${a * a})²`]; }
      else { expr = poly(k * k, 0, -a * a); bon = `(${X} − ${a})(${X} + ${a})`; faux = [`(${X} − ${a})²`, `(${X} + ${a})²`, `(${X} − ${a * a})(${X} + ${a * a})`]; }
      return { comp: "l-factoriser", enonce: `Quelle est la factorisation de <b>${expr}</b> ?`, type: "qcm", choix: melanger([bon, ...faux]), reponse: bon,
        explication: cas === 2 ? `On reconnaît a² − b² = (a − b)(a + b) avec a = ${X} et b = ${a}.` : `On reconnaît ${cas === 0 ? "a² + 2ab + b² = (a + b)²" : "a² − 2ab + b² = (a − b)²"} avec a = ${X} et b = ${a} : 2 × ${X} × ${a} = ${2 * k * a}x.` };
    },
    factoriserCommun() {
      const a = nonNul(-6, 6), b = nonNul(1, 4), c = nonNul(-6, 6), d = nonNul(1, 4), e = nonNul(-6, 6);
      const F = `(x${signe(a)})`;
      const bon = `${F}(${lin(b + d, c + e)})`;
      const faux = [`${F}(${lin(b - d, c - e)})`, `${F}(${lin(b * d, c * e)})`, `(x${signe(-a)})(${lin(b + d, c + e)})`];
      return { comp: "l-factoriser", enonce: `Factorise :<div class="calc">${F}(${lin(b, c)}) + ${F}(${lin(d, e)})</div>`, type: "qcm", choix: melanger([...new Set([bon, ...faux])].slice(0, 4)), reponse: bon,
        explication: `Le facteur commun est ${F}. On l'écrit devant et on additionne ce qui reste : ${F}[(${lin(b, c)}) + (${lin(d, e)})] = <b>${bon}</b>.` };
    },
    produitNul() {
      const a = nonNul(1, 5), b = nonNul(-9, 9), c = nonNul(1, 5), d = nonNul(-9, 9);
      if (-b / a === -d / c) return L.produitNul();
      return { comp: "l-produitnul", enonce: `Résous l'équation :<div class="calc">(${lin(a, b)})(${lin(c, d)}) = 0</div>Donne les deux solutions.`, type: "deux",
        reponse: [-b / a, -d / c], affiche: fracTexte(-b, a) + " et " + fracTexte(-d, c),
        explication: `Un produit est nul si l'un de ses facteurs est nul :<br>${lin(a, b)} = 0 donne x = ${fracHtml(-b, a)} ; ${lin(c, d)} = 0 donne x = ${fracHtml(-d, c)}.` };
    },
    memeCarre() {
      const a = hasard(2, 12);
      return { comp: "l-produitnul", enonce: `Résous l'équation :<div class="calc">x² = ${a * a}</div>Donne les deux solutions.`, type: "deux", reponse: [a, -a], affiche: `${a} et −${a}`,
        explication: `Deux nombres ont le même carré ${a * a} : ${a} et −${a}, car ${a}² = (−${a})² = ${a * a}.` };
    },
    fractionRationnelle() {
      const a = nonNul(-8, 8), b = nonNul(1, 5), c = nonNul(-10, 10);
      return { comp: "l-fraction", enonce: `La fraction rationnelle <b>${fr("x" + signe(a), lin(b, c))}</b> existe pour toutes les valeurs de x sauf une. Laquelle ?`, type: "nombre",
        reponse: -c / b, affiche: fracTexte(-c, b),
        explication: `Une fraction existe si son dénominateur n'est pas nul. ${lin(b, c)} = 0 donne x = ${fracHtml(-c, b)}. Elle existe donc pour <b>x ≠ ${fracHtml(-c, b)}</b>.` };
    },
    defiTerrain() {
      const a = hasard(2, 8), b = hasard(1, 6);
      const lieu = parmi(["à Daloa", "à Bouaké", "à Yamoussoukro", "à Korhogo", "à Abidjan"]);
      return { comp: "l-developper", defi: true,
        enonce: `<b>Situation.</b> Le collège ${lieu} agrandit son jardin, carré de côté x mètres : on ajoute ${a} m à la longueur et on retire ${b} m à la largeur.<br>Écris l'aire du nouveau jardin (x + ${a})(x − ${b}) sous forme développée.`,
        type: "coeffs", modele: ["", "x² +", "x +", ""], reponse: [1, a - b, -a * b], affiche: poly(1, a - b, -a * b),
        explication: `(x + ${a})(x − ${b}) = x² − ${b}x + ${a}x − ${a * b} = <b>${poly(1, a - b, -a * b)}</b> (en m²).` };
    }
  };

  // =========================================================
  // Leçon 2 : Propriétés de Thalès dans un triangle
  // =========================================================
  function figureThales(val) {
    // A en haut, B et C en bas, M sur [AB], N sur [AC], (MN) // (BC)
    const A = [150, 20], B = [30, 190], C = [280, 190], t = val.t;
    const M = [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t], N = [A[0] + (C[0] - A[0]) * t, A[1] + (C[1] - A[1]) * t];
    const milieu = (P, Q, dx = 0, dy = 0) => [(P[0] + Q[0]) / 2 + dx, (P[1] + Q[1]) / 2 + dy];
    const etiquette = (txt, [x, y], nom, ancre) => txt ? `<text x="${x}" y="${y}" class="lg" text-anchor="${ancre}">${nom} = ${txt}</text>` : "";
    const sur = (P, Q, f, dx, dy) => [P[0] + (Q[0] - P[0]) * f + dx, P[1] + (Q[1] - P[1]) * f + dy];
    return `<svg viewBox="-50 0 410 225" class="figure" role="img" aria-label="Triangle ABC avec M sur AB et N sur AC, MN parallèle à BC">
      <polygon points="${A} ${B} ${C}" class="tri"/>
      <line x1="${M[0]}" y1="${M[1]}" x2="${N[0]}" y2="${N[1]}" class="para"/>
      ${[["A", A, -4, -6], ["B", B, -16, 14], ["C", C, 6, 14], ["M", M, -18, 4], ["N", N, 8, 4]].map(([n, P, dx, dy]) => `<text x="${P[0] + dx}" y="${P[1] + dy}" class="pt">${n}</text><circle cx="${P[0]}" cy="${P[1]}" r="2.6" class="pt-c"/>`).join("")}
      ${etiquette(val.AM, sur(A, B, t / 2, -10, 5), "AM", "end")}${etiquette(val.AB, sur(A, B, (1 + t) / 2 + 0.05, -12, 5), "AB", "end")}${etiquette(val.AN, sur(A, C, t / 2, 10, 5), "AN", "start")}${etiquette(val.AC, sur(A, C, (1 + t) / 2 + 0.05, 12, 5), "AC", "start")}
      ${etiquette(val.MN, milieu(M, N, 0, 18), "MN", "middle")}${etiquette(val.BC, milieu(B, C, 0, 24), "BC", "middle")}
    </svg>`;
  }
  const T = {
    longueur() {
      const p = hasard(1, 4), q = p + hasard(1, 4), g = pgcd(p, q), pp = p / g, qq = q / g;
      const u = hasard(1, 3), s = hasard(1, 4);
      const AM = pp * u, AB = qq * u, AN = pp * s, AC = qq * s;
      const cherche = parmi(["AN", "AC"]);
      const val = { t: AM / AB, AM: AM + " cm", AB: AB + " cm", AN: cherche === "AN" ? "?" : AN + " cm", AC: cherche === "AC" ? "?" : AC + " cm" };
      const rep = cherche === "AN" ? AN : AC;
      return { comp: "t-longueur", figure: figureThales(val),
        enonce: `Les droites (MN) et (BC) sont parallèles. AM = ${AM} cm, AB = ${AB} cm, ${cherche === "AN" ? "AC = " + AC : "AN = " + AN} cm.<br>Calcule <b>${cherche}</b> (en cm).`,
        type: "nombre", reponse: rep, affiche: String(rep),
        explication: `Propriété de Thalès : ${fr("AM", "AB")} = ${fr("AN", "AC")} = ${fr("MN", "BC")}.<br>${cherche === "AN" ? `AN = AC × ${fr("AM", "AB")} = ${AC} × ${fr(AM, AB)} = <b>${AN} cm</b>.` : `AC = AN × ${fr("AB", "AM")} = ${AN} × ${fr(AB, AM)} = <b>${AC} cm</b>.`}` };
    },
    consequence() {
      const p = hasard(1, 3), q = p + hasard(1, 3), g = pgcd(p, q), pp = p / g, qq = q / g;
      const u = hasard(1, 3), w = hasard(1, 4);
      const AM = pp * u, AB = qq * u, MN = pp * w, BC = qq * w;
      const cherche = parmi(["MN", "BC"]);
      const val = { t: AM / AB, AM: AM + " cm", AB: AB + " cm", MN: cherche === "MN" ? "?" : MN + " cm", BC: cherche === "BC" ? "?" : BC + " cm" };
      const rep = cherche === "MN" ? MN : BC;
      return { comp: "t-longueur", figure: figureThales(val),
        enonce: `(MN) // (BC). AM = ${AM} cm, AB = ${AB} cm, ${cherche === "MN" ? "BC = " + BC : "MN = " + MN} cm.<br>Calcule <b>${cherche}</b> (en cm).`,
        type: "nombre", reponse: rep, affiche: String(rep),
        explication: `Conséquence de la propriété de Thalès : ${fr("MN", "BC")} = ${fr("AM", "AB")}.<br>${cherche === "MN" ? `MN = BC × ${fr("AM", "AB")} = ${BC} × ${fr(AM, AB)} = <b>${MN} cm</b>.` : `BC = MN × ${fr("AB", "AM")} = ${MN} × ${fr(AB, AM)} = <b>${BC} cm</b>.`}` };
    },
    quotients() {
      const bon = `${fr("AN", "AC")}`;
      const faux = [fr("AN", "NC"), fr("MB", "AB"), fr("MN", "AC")];
      return { comp: "t-reconnaitre", figure: figureThales({ t: 0.45 }),
        enonce: `(MN) // (BC). Quel quotient est égal à ${fr("AM", "AB")} ?`, type: "qcm", choix: melanger([bon, ...faux]), reponse: bon,
        explication: `Dans la configuration de Thalès, on compare les longueurs <b>depuis le sommet A</b> : ${fr("AM", "AB")} = ${fr("AN", "AC")} = ${fr("MN", "BC")}.` };
    },
    reciproque() {
      const parallele = Math.random() < 0.5;
      const p = hasard(1, 3), q = p + hasard(1, 3);
      const u = hasard(1, 3), s = hasard(1, 3);
      const AM = p * u, AB = q * u, AC = q * s;
      let AN = p * s;
      const ecarts = [1, -1].filter(d => AN + d > 0 && AN + d < AC);
      if (!parallele && ecarts.length) AN = AN + parmi(ecarts);
      const ok = AM * AC === AN * AB;
      return { comp: "t-reciproque", figure: figureThales({ t: AM / AB, AM: AM + " cm", AB: AB + " cm", AN: AN + " cm", AC: AC + " cm" }),
        enonce: `M est sur [AB] et N sur [AC], dans le même ordre. AM = ${AM} cm, AB = ${AB} cm, AN = ${AN} cm, AC = ${AC} cm.<br>Les droites (MN) et (BC) sont-elles parallèles ?`,
        type: "qcm", choix: ["Oui, elles sont parallèles", "Non, elles ne sont pas parallèles"], reponse: ok ? "Oui, elles sont parallèles" : "Non, elles ne sont pas parallèles",
        explication: `On compare ${fr("AM", "AB")} = ${fr(AM, AB)} et ${fr("AN", "AC")} = ${fr(AN, AC)} : produits en croix ${AM} × ${AC} = ${AM * AC} et ${AN} × ${AB} = ${AN * AB}. ${ok ? "Ils sont égaux : d'après la <b>réciproque</b> de la propriété de Thalès, (MN) // (BC)." : "Ils sont différents : les quotients ne sont pas égaux, donc (MN) et (BC) <b>ne sont pas</b> parallèles."}` };
    },
    defiToit() {
      const H = parmi([3, 4, 6]), L2 = parmi([5, 6, 8]), d = parmi([1, 2, 3].filter(x => x < L2));
      const h = H * (L2 - d) / L2;
      return { comp: "t-longueur", defi: true,
        enonce: `<b>Situation.</b> Le toit du préau du collège forme un triangle rectangle : une barre verticale de ${H} m est placée au milieu, et le toit descend jusqu'au sol ${L2} m plus loin. Le charpentier doit poser une barre verticale parallèle, à ${d} m de la première.<br>Quelle est sa longueur (en m) ?`,
        type: "nombre", reponse: h, affiche: fracTexte(H * (L2 - d), L2).replace("/", " / ") + (Number.isInteger(h) ? "" : " ≈ " + h.toFixed(2).replace(".", ",")),
        explication: `Les deux barres sont parallèles (toutes deux verticales). Depuis le bas du toit, les distances sont ${L2} m et ${L2 - d} m. Thalès : ${fr("h", H)} = ${fr(L2 - d, L2)}, donc h = ${H} × ${fr(L2 - d, L2)} = <b>${fracHtml(H * (L2 - d), L2)} m</b>${Number.isInteger(h) ? "" : " ≈ " + h.toFixed(2).replace(".", ",") + " m"}.` };
    }
  };

  // =========================================================
  // Leçon 3 : Racines carrées
  // =========================================================
  const R = {
    carre() {
      const a = hasard(2, 15), neg = Math.random() < 0.5;
      return { comp: "r-definition", enonce: `Calcule :<div class="calc">${rac(neg ? "(−" + a + ")²" : a * a)}</div>`, type: "nombre", reponse: a, affiche: String(a),
        explication: neg ? `${rac("a²")} = |a| : ${rac("(−" + a + ")²")} = |−${a}| = <b>${a}</b>. Une racine carrée n'est jamais négative.` : `${a}² = ${a * a}, donc ${rac(a * a)} = <b>${a}</b>.` };
    },
    simplifier() {
      const m = parmi([2, 3, 5, 6, 7, 10]), k = hasard(2, 7), n = k * k * m;
      return { comp: "r-simplifier", enonce: `Écris sous la forme a${rac("b")} avec b le plus petit possible :<div class="calc">${rac(n)}</div>`, type: "coeffs", modele: ["", "√", ""],
        reponse: [k, m], racine: true, affiche: `${k}√${m}`,
        explication: `${n} = ${k * k} × ${m} et ${k * k} = ${k}², donc ${rac(n)} = ${rac(k * k)} × ${rac(m)} = <b>${k}${rac(m)}</b>.` };
    },
    somme() {
      const m = parmi([2, 3, 5]), k1 = hasard(1, 4), k2 = hasard(2, 4), a = hasard(1, 5), b = nonNul(-4, 4);
      const n2 = k2 * k2 * m, r = a + b * k2;
      return { comp: "r-operations", enonce: `Calcule et écris sous la forme a${rac(m)} :<div class="calc">${a === 1 ? "" : a}${rac(m)} ${b < 0 ? "−" : "+"} ${Math.abs(b) === 1 ? "" : Math.abs(b)}${rac(n2)}</div>`,
        type: "coeffs", modele: ["", "√" + m], reponse: [r], affiche: `${moins(r)}√${m}`,
        explication: `${rac(n2)} = ${k2}${rac(m)}, donc ${Math.abs(b) === 1 ? "" : Math.abs(b)}${rac(n2)} = ${Math.abs(b * k2)}${rac(m)}. Puis ${a}${rac(m)} ${b < 0 ? "−" : "+"} ${Math.abs(b * k2)}${rac(m)} = <b>${moins(r)}${rac(m)}</b>.` };
    },
    produit() {
      const m = parmi([2, 3, 5, 6, 7]), a = hasard(1, 4), b = hasard(1, 4);
      const x = a * a * m, y = b * b * m, r = a * b * m;
      return { comp: "r-operations", enonce: `Calcule :<div class="calc">${rac(x)} × ${rac(y)}</div>`, type: "nombre", reponse: r, affiche: String(r),
        explication: `${rac("a")} × ${rac("b")} = ${rac("ab")} : ${rac(x + " × " + y)} = ${rac(x * y)} = <b>${r}</b> (car ${r}² = ${x * y}).` };
    },
    developper() {
      const a = hasard(1, 6), b = parmi([2, 3, 5, 7]), s = parmi([1, -1]);
      return { comp: "r-operations", enonce: `Développe et réduis :<div class="calc">(${a} ${s > 0 ? "+" : "−"} ${rac(b)})²</div>Écris le résultat sous la forme p + q${rac(b)}.`,
        type: "coeffs", modele: ["", "+", "√" + b], reponse: [a * a + b, s * 2 * a], affiche: `${a * a + b} ${s > 0 ? "+" : "−"} ${2 * a}√${b}`,
        explication: `${s > 0 ? "(a + b)² = a² + 2ab + b²" : "(a − b)² = a² − 2ab + b²"} : ${a}² ${s > 0 ? "+" : "−"} 2 × ${a} × ${rac(b)} + ${rac(b)}² = ${a * a} ${s > 0 ? "+" : "−"} ${2 * a}${rac(b)} + ${b} = <b>${a * a + b} ${s > 0 ? "+" : "−"} ${2 * a}${rac(b)}</b>.` };
    },
    sansRadical() {
      const b = parmi([2, 3, 5, 6, 7]), a = hasard(1, 9);
      const [n, d] = reduireFrac(a, b);
      const bon = d === 1 ? `${n}${rac(b)}` : `${fr((n === 1 ? "" : n) + rac(b), d)}`;
      const faux = [`${fr(a, b)}`, `${fr(a + rac(b), a)}`, `${a}${rac(b)}`].filter(x => x !== bon);
      return { comp: "r-radical", enonce: `Écris sans radical au dénominateur :<div class="calc">${fr(a, rac(b))}</div>`, type: "qcm", choix: melanger([bon, ...faux.slice(0, 3)]), reponse: bon,
        explication: `On multiplie en haut et en bas par ${rac(b)} : ${fr(a + " × " + rac(b), rac(b) + " × " + rac(b))} = ${fr(a + rac(b), b)}${d !== b || n !== a ? " = " + bon : ""}.` };
    },
    conjugue() {
      const m = hasard(1, 6), a = parmi([2, 3, 5, 7]), s = parmi(["+", "−"]);
      const autre = s === "+" ? "−" : "+";
      const bon = `${m} ${autre} ${rac(a)}`;
      return { comp: "r-radical", enonce: `Quelle est l'expression conjuguée de <b>${m} ${s} ${rac(a)}</b> ?`, type: "qcm",
        choix: melanger([bon, `${m} ${s} ${rac(a)}`, `−${m} ${s} ${rac(a)}`, `${rac(m)} ${autre} ${a}`]), reponse: bon,
        explication: `On change seulement le signe devant la racine : le conjugué de ${m} ${s} ${rac(a)} est <b>${bon}</b>. Leur produit donne ${m}² − ${a} = ${m * m - a}, sans racine.` };
    },
    valeurAbsolue() {
      const n = parmi([2, 3, 5, 6, 7, 8, 10, 11, 12, 13, 14, 15]), e = Math.floor(Math.sqrt(n)) + parmi([0, 1]);
      const pos = Math.sqrt(n) - e > 0;
      const bon = pos ? `${rac(n)} − ${e}` : `${e} − ${rac(n)}`;
      return { comp: "r-definition", enonce: `Écris sans valeur absolue :<div class="calc">|${rac(n)} − ${e}|</div>`, type: "qcm",
        choix: melanger([`${rac(n)} − ${e}`, `${e} − ${rac(n)}`, `${rac(n)} + ${e}`]), reponse: bon,
        explication: `${rac(n)} ≈ ${Math.sqrt(n).toFixed(2).replace(".", ",")}, donc ${rac(n)} − ${e} est ${pos ? "positif" : "négatif"}. ${pos ? "Un nombre positif est égal à sa valeur absolue" : "La valeur absolue d'un nombre négatif est son opposé"} : <b>${bon}</b>.` };
    },
    defiFerme() {
      const k = hasard(3, 9), m = parmi([2, 3, 5]), aire = k * k * m;
      const village = parmi(["Foula", "Boundiali", "Dabou", "Man", "Odienné"]);
      return { comp: "r-simplifier", defi: true,
        enonce: `<b>Situation.</b> Une ferme de ${village} est carrée et a une aire de ${aire} m². Quel est son côté exact, sous la forme a${rac("b")} (en m) ?`,
        type: "coeffs", modele: ["", "√", ""], reponse: [k, m], racine: true, affiche: `${k}√${m}`,
        explication: `Le côté vaut ${rac(aire)} = ${rac(k * k + " × " + m)} = <b>${k}${rac(m)} m</b> ≈ ${(k * Math.sqrt(m)).toFixed(1).replace(".", ",")} m.` };
    }
  };

  // =========================================================
  // Maths : leçons 4 à 14 (progression officielle 3e)
  // =========================================================
  const TRIPLETS = [[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17], [9, 12, 15], [7, 24, 25], [12, 16, 20], [20, 21, 29], [15, 20, 25]];
  const LETTRES = ["ABC", "EFG", "RST", "IJK", "MNP", "DEF"];
  const dec = x => String(Math.round(x * 1000) / 1000).replace(".", ",");
  const oui = (q, bon, faux, expl, comp) => ({ comp, enonce: q, type: "qcm", choix: melanger([bon, ...faux]), reponse: bon, affiche: bon, explication: expl });
  function figureCercle(etiqAngle) {
    // cercle de centre O, A et B en bas, C en haut ; angle au centre AOB et angle inscrit ACB
    const O = [150, 110], r = 85, pt = d => [O[0] + r * Math.cos(d * Math.PI / 180), O[1] - r * Math.sin(d * Math.PI / 180)];
    const A = pt(215), B = pt(325), C = pt(100);
    const l = (P, Q, c = "tri") => `<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" class="${c}"/>`;
    const t = (n, P, dx, dy) => `<text x="${P[0] + dx}" y="${P[1] + dy}" class="pt">${n}</text><circle cx="${P[0]}" cy="${P[1]}" r="2.6" class="pt-c"/>`;
    return `<svg viewBox="0 0 300 215" class="figure" role="img" aria-label="Cercle de centre O avec les points A, B et C">
      <circle cx="${O[0]}" cy="${O[1]}" r="${r}" class="tri"/>${l(A, C)}${l(B, C)}${l(A, O, "para")}${l(B, O, "para")}
      ${t("A", A, -18, 12)}${t("B", B, 8, 12)}${t("C", C, -6, -8)}${t("O", O, -6, -10)}
      ${etiqAngle || ""}</svg>`;
  }

  const TR = {
    hypotenuse() {
      const [a, b, c] = parmi(TRIPLETS), [P, Q, S] = parmi(LETTRES);
      return { comp: "tr-pythagore", enonce: `Le triangle ${P}${Q}${S} est rectangle en ${P}. ${P}${Q} = ${a} cm et ${P}${S} = ${b} cm.<br>Calcule <b>${Q}${S}</b> (en cm).`,
        type: "nombre", reponse: c, affiche: c + " cm",
        explication: `Propriété de Pythagore : ${Q}${S}² = ${P}${Q}² + ${P}${S}² = ${a * a} + ${b * b} = ${c * c}, donc ${Q}${S} = ${rac(c * c)} = <b>${c} cm</b>.` };
    },
    cote() {
      const [a, b, c] = parmi(TRIPLETS), [P, Q, S] = parmi(LETTRES);
      return { comp: "tr-pythagore", enonce: `Le triangle ${P}${Q}${S} est rectangle en ${P}. ${Q}${S} = ${c} cm et ${P}${Q} = ${a} cm.<br>Calcule <b>${P}${S}</b> (en cm).`,
        type: "nombre", reponse: b, affiche: b + " cm",
        explication: `${Q}${S} est l'hypoténuse. ${P}${S}² = ${Q}${S}² − ${P}${Q}² = ${c * c} − ${a * a} = ${b * b}, donc ${P}${S} = <b>${b} cm</b>.` };
    },
    hypRacine() {
      const a = hasard(1, 7), b = hasard(1, 7), n = a * a + b * b;
      let k = 1; for (let d = 2; d * d <= n; d++) if (n % (d * d) === 0) k = d;
      const m = n / (k * k);
      if (m === 1) return TR.hypotenuse();
      return { comp: "tr-pythagore", enonce: `ABC est rectangle en A, AB = ${a} cm et AC = ${b} cm. Donne BC sous la forme a${rac("b")} (b le plus petit possible ; si a = 1, écris 1).`,
        type: "coeffs", modele: ["BC = ", "√", " cm"], reponse: [k, m], racine: true, affiche: `${k}√${m} cm`,
        explication: `BC² = ${a}² + ${b}² = ${n}, donc BC = ${rac(n)}${k > 1 ? ` = ${rac(k * k + " × " + m)} = <b>${k}${rac(m)} cm</b>` : ` = <b>1${rac(m)}</b>, c'est-à-dire ${rac(m)} cm`}.` };
    },
    reciproque() {
      const [a, b, c] = parmi(TRIPLETS), rect = Math.random() < 0.5, c2 = rect ? c : c + parmi([-1, 1]);
      const bon = rect ? "Oui, il est rectangle" : "Non, il n'est pas rectangle";
      return { comp: "tr-reciproque", enonce: `Un triangle a pour côtés ${a} cm, ${b} cm et ${c2} cm. Est-il rectangle ?`, type: "qcm",
        choix: ["Oui, il est rectangle", "Non, il n'est pas rectangle"], reponse: bon, affiche: bon,
        explication: `On compare le carré du plus grand côté à la somme des carrés des deux autres : ${c2}² = ${c2 * c2} et ${a}² + ${b}² = ${a * a + b * b}. ${rect ? "Égalité : d'après la <b>réciproque</b> de Pythagore, le triangle est rectangle." : "Pas d'égalité : le triangle <b>n'est pas</b> rectangle."}` };
    },
    rapport() {
      const [a, b, c] = parmi(TRIPLETS), g = pgcd(pgcd(a, b), c);
      const f = parmi(["cos", "sin", "tan"]);
      const [n, d] = f === "cos" ? [a, c] : f === "sin" ? [b, c] : [b, a];
      return { comp: "tr-trigo", enonce: `ABC est rectangle en A, AB = ${a}, AC = ${b} et BC = ${c}.<br>Calcule <b>${f} B̂</b> (fraction simplifiée ou décimal).`,
        type: "nombre", reponse: n / d, affiche: fracTexte(n, d),
        explication: `Pour l'angle B : côté adjacent AB, côté opposé AC, hypoténuse BC.<br>${f === "cos" ? `cos B̂ = ${fr("adjacent", "hypoténuse")} = ${fr("AB", "BC")}` : f === "sin" ? `sin B̂ = ${fr("opposé", "hypoténuse")} = ${fr("AC", "BC")}` : `tan B̂ = ${fr("opposé", "adjacent")} = ${fr("AC", "AB")}`} = ${fr(n, d)} = <b>${fracHtml(n, d)}</b>.<br>Moyen mnémotechnique : <b>SOH CAH TOA</b>.` };
    },

      const [a, b, c] = parmi(TRIPLETS.slice(0, 5)), xa = hasard(-4, 4), ya = hasard(-4, 4), sx = parmi([1, -1]), sy = parmi([1, -1]);
      const xb = xa + sx * a, yb = ya + sy * b;
      return { comp: "co-coordonnees", enonce: `Le repère est orthonormé. A(${moins(xa)} ; ${moins(ya)}) et B(${moins(xb)} ; ${moins(yb)}). Calcule la distance <b>AB</b>.`, type: "nombre", reponse: c, affiche: String(c),
        explication: `AB = ${rac("(x<sub>B</sub> − x<sub>A</sub>)² + (y<sub>B</sub> − y<sub>A</sub>)²")} = ${rac(`${par(xb - xa)}² + ${par(yb - ya)}²`)} = ${rac(a * a + b * b)} = <b>${c}</b>.` };
    },
    combinaison() {
      const x1 = hasard(-4, 4), y1 = hasard(-4, 4), x2 = hasard(-4, 4), y2 = hasard(-4, 4), k = parmi([2, 3, -2]);
      return { comp: "co-coordonnees", enonce: `u⃗(${moins(x1)} ; ${moins(y1)}) et v⃗(${moins(x2)} ; ${moins(y2)}). Donne les coordonnées de <b>u⃗ + ${moins(k)}v⃗</b>.`,
        type: "coeffs", modele: ["(", " ; ", ")"], reponse: [x1 + k * x2, y1 + k * y2], affiche: `(${moins(x1 + k * x2)} ; ${moins(y1 + k * y2)})`,
        explication: `${moins(k)}v⃗ (${moins(k * x2)} ; ${moins(k * y2)}), puis on additionne coordonnée par coordonnée : <b>(${moins(x1 + k * x2)} ; ${moins(y1 + k * y2)})</b>.` };
    },
    colineaires() {
      const x = nonNul(-4, 4), y = nonNul(-4, 4), k = parmi([2, 3, -2]), col = Math.random() < 0.5;
      const x2 = k * x, y2 = col ? k * y : k * y + parmi([1, -1]);
      const det = x * y2 - y * x2;
      return oui(`Les vecteurs u⃗(${moins(x)} ; ${moins(y)}) et v⃗(${moins(x2)} ; ${moins(y2)}) sont-ils colinéaires ?`, col ? "Oui" : "Non", [col ? "Non" : "Oui"],
        `On calcule xy' − x'y = ${par(x)} × ${par(y2)} − ${par(x2)} × ${par(y)} = ${moins(det)}. ${col ? "C'est 0 : les vecteurs sont <b>colinéaires</b>." : "Ce n'est pas 0 : ils ne sont <b>pas colinéaires</b>."}`, "co-coordonnees");
    },
    parallelogramme() {
      const A = [hasard(-4, 4), hasard(-4, 4)], B = [hasard(-4, 4), hasard(-4, 4)], C = [hasard(-4, 4), hasard(-4, 4)];
      const D = [A[0] + C[0] - B[0], A[1] + C[1] - B[1]];
      return { comp: "co-coordonnees", defi: true, enonce: `A(${moins(A[0])} ; ${moins(A[1])}), B(${moins(B[0])} ; ${moins(B[1])}), C(${moins(C[0])} ; ${moins(C[1])}). Trouve D tel que ABCD soit un parallélogramme.`,
        type: "coeffs", modele: ["D (", " ; ", ")"], reponse: D, affiche: `(${moins(D[0])} ; ${moins(D[1])})`,
        explication: `ABCD parallélogramme ⇔ AD⃗ = BC⃗. BC⃗ (${moins(C[0] - B[0])} ; ${moins(C[1] - B[1])}), donc x<sub>D</sub> = ${moins(A[0])} + ${par(C[0] - B[0])} = ${moins(D[0])} et y<sub>D</sub> = ${moins(A[1])} + ${par(C[1] - B[1])} = ${moins(D[1])}. <b>D(${moins(D[0])} ; ${moins(D[1])})</b>.` };
    }
  };

  const DR = {
    coefficient() {
      const xa = hasard(-4, 3), xb = xa + hasard(1, 4), ya = hasard(-5, 5), yb = hasard(-5, 5);
      return { comp: "dr-droites", enonce: `A(${moins(xa)} ; ${moins(ya)}) et B(${moins(xb)} ; ${moins(yb)}). Calcule le <b>coefficient directeur</b> de la droite (AB).`, type: "nombre", reponse: (yb - ya) / (xb - xa), affiche: fracTexte(yb - ya, xb - xa),
        explication: `a = ${fr("y<sub>B</sub> − y<sub>A</sub>", "x<sub>B</sub> − x<sub>A</sub>")} = ${fr(moins(yb) + " − " + par(ya), moins(xb) + " − " + par(xa))} = <b>${fracHtml(yb - ya, xb - xa)}</b>.` };
    },
    equation() {
      const a = nonNul(-4, 4), b = hasard(-6, 6), xa = hasard(-3, 0), xb = xa + hasard(1, 3);
      const ya = a * xa + b, yb = a * xb + b;
      return { comp: "dr-droites", enonce: `Détermine une équation de la droite (AB) avec A(${moins(xa)} ; ${moins(ya)}) et B(${moins(xb)} ; ${moins(yb)}).`,
        type: "coeffs", modele: ["y = ", "x + ", ""], reponse: [a, b], affiche: `y = ${lin(a, b)}`,
        explication: `Coefficient directeur : a = ${fr(moins(yb) + " − " + par(ya), moins(xb) + " − " + par(xa))} = ${moins(a)}. Puis A est sur la droite : ${moins(ya)} = ${moins(a)} × ${par(xa)} + b, donc b = ${moins(b)}. Équation : <b>y = ${lin(a, b)}</b>.` };
    },
    appartient() {
      const a = nonNul(-3, 3), b = hasard(-5, 5), x = hasard(-3, 3), dedans = Math.random() < 0.5, y = a * x + b + (dedans ? 0 : parmi([1, -1, 2]));
      return oui(`Le point P(${moins(x)} ; ${moins(y)}) appartient-il à la droite d'équation y = ${lin(a, b)} ?`, dedans ? "Oui" : "Non", [dedans ? "Non" : "Oui"],
        `On remplace x par ${moins(x)} : ${moins(a)} × ${par(x)} ${signe(b)} = ${moins(a * x + b)}. ${dedans ? "On trouve bien y<sub>P</sub> : P est <b>sur</b> la droite." : `On ne trouve pas ${moins(y)} : P n'est <b>pas</b> sur la droite.`}`, "dr-droites");
    },
    parallele() {
      const a = nonNul(-4, 4), b = hasard(-5, 5), x = hasard(-3, 3), y = hasard(-5, 5), b2 = y - a * x;
      return { comp: "dr-droites", enonce: `Donne l'équation de la droite parallèle à (D) : y = ${lin(a, b)} passant par P(${moins(x)} ; ${moins(y)}).`,
        type: "coeffs", modele: ["y = ", "x + ", ""], reponse: [a, b2], affiche: `y = ${lin(a, b2)}`,
        explication: `Deux droites parallèles ont le <b>même coefficient directeur</b> : a = ${moins(a)}. Puis ${moins(y)} = ${moins(a)} × ${par(x)} + b donne b = ${moins(b2)}. <b>y = ${lin(a, b2)}</b>.` };
    },
    perpendiculaire() {
      const a = parmi([2, 3, 4, -2, -3, -1, 1, 5]);
      return { comp: "dr-droites", enonce: `Une droite a pour coefficient directeur ${moins(a)}. Quel est le coefficient directeur d'une droite <b>perpendiculaire</b> (repère orthonormé) ?`, type: "nombre", reponse: -1 / a, affiche: fracTexte(-1, a),
        explication: `Deux droites sont perpendiculaires si le produit de leurs coefficients directeurs vaut −1 : a × a' = −1, donc a' = ${fr(-1, moins(a))} = <b>${fracHtml(-1, a)}</b>.` };
    }
  };

  const ST = {
    moyenne() {
      const vals = melanger([6, 8, 10, 12, 14, 16]).slice(0, 4).sort((x, y) => x - y), eff = [hasard(1, 4), hasard(1, 4), hasard(1, 4), 0];
      eff[3] = 10 - eff[0] - eff[1] - eff[2]; if (eff[3] < 1) return ST.moyenne();
      const tot = vals.reduce((s, v, i) => s + v * eff[i], 0), m = tot / 10;
      return { comp: "st-stats", enonce: `Notes d'une classe de 10 élèves :<table class="vocab"><tr><td>Note</td>${vals.map(v => `<td>${v}</td>`).join("")}</tr><tr><td>Effectif</td>${eff.map(e => `<td>${e}</td>`).join("")}</tr></table>Calcule la <b>moyenne</b>.`,
        type: "nombre", reponse: m, affiche: dec(m),
        explication: `Moyenne = ${fr("somme des (note × effectif)", "effectif total")} = ${fr(vals.map((v, i) => v + "×" + eff[i]).join(" + "), 10)} = ${fr(tot, 10)} = <b>${dec(m)}</b>.` };
    },
    mediane() {
      const n = parmi([7, 9, 11]), l = Array.from({ length: n }, () => hasard(2, 20)), t = [...l].sort((a, b) => a - b), med = t[(n - 1) / 2];
      return { comp: "st-stats", enonce: `Voici les âges (en ans) de ${n} enfants d'une famille élargie : ${l.join(" ; ")}.<br>Détermine la <b>médiane</b>.`, type: "nombre", reponse: med, affiche: String(med),
        explication: `On range dans l'ordre croissant : ${t.join(" ; ")}. Il y a ${n} valeurs, la médiane est la ${(n + 1) / 2}e : <b>${med}</b>. Autant de valeurs en dessous qu'au-dessus.` };
    },
    angle() {
      const tot = parmi([36, 60, 72, 90, 120]), e = hasard(1, tot / 3) ;
      const a = e * 360 / tot;
      if (!Number.isInteger(a)) return ST.angle();
      return { comp: "st-stats", enonce: `Dans un collège, sur ${tot} élèves interrogés, ${e} préfèrent le football. Dans un diagramme circulaire, quel angle (en degrés) représente le football ?`, type: "nombre", reponse: a, affiche: a + "°",
        explication: `Angle = ${fr("effectif", "effectif total")} × 360° = ${fr(e, tot)} × 360° = <b>${a}°</b>.` };
    },
    frequence() {
      const tot = parmi([20, 25, 40, 50]), e = hasard(1, tot - 1), f = e / tot * 100;
      return { comp: "st-stats", enonce: `Sur ${tot} candidats d'un centre, ${e} sont admis. Quelle est la <b>fréquence</b> des admis, en % ?`, type: "nombre", reponse: f, affiche: dec(f) + " %",
        explication: `Fréquence = ${fr("effectif", "effectif total")} × 100 = ${fr(e, tot)} × 100 = <b>${dec(f)} %</b>.` };
    },
    cumul() {
      const vals = [10, 11, 12, 13, 14], eff = vals.map(() => hasard(1, 8)), k = hasard(1, 3), c = eff.slice(0, k + 1).reduce((s, x) => s + x, 0);
      return { comp: "st-stats", enonce: `Âges des élèves d'un club :<table class="vocab"><tr><td>Âge</td>${vals.map(v => `<td>${v}</td>`).join("")}</tr><tr><td>Effectif</td>${eff.map(e => `<td>${e}</td>`).join("")}</tr></table>Quel est l'<b>effectif cumulé croissant</b> de l'âge ${vals[k]} ?`,
        type: "nombre", reponse: c, affiche: String(c),
        explication: `On additionne les effectifs de toutes les valeurs inférieures ou égales à ${vals[k]} : ${eff.slice(0, k + 1).join(" + ")} = <b>${c}</b>. C'est le nombre d'élèves qui ont ${vals[k]} ans ou moins.` };
    },
    mode() {
      const vals = ["Attiéké", "Riz", "Foutou", "Placali", "Alloco"], eff = melanger([3, 5, 7, 9, 12]);
      const i = eff.indexOf(12);
      return oui(`Plat préféré de 36 élèves : ${vals.map((v, j) => v + " : " + eff[j]).join(", ")}. Quel est le <b>mode</b> de cette série ?`, vals[i], vals.filter((_, j) => j !== i).slice(0, 3),
        `Le mode est la modalité qui a le <b>plus grand effectif</b> : <b>${vals[i]}</b> (12 élèves).`, "st-stats");
    }
  };

  const SY = {
    resoudre() {
      const x = hasard(-5, 6), y = hasard(-5, 6);
      let a, b, c, d; do { a = nonNul(-3, 4); b = nonNul(-3, 4); c = nonNul(-3, 4); d = nonNul(-3, 4); } while (a * d - b * c === 0);
      const e = a * x + b * y, f = c * x + d * y;
      const eq = (p, q, r) => `${poly(0, p, 0, "x")} ${q < 0 ? "−" : "+"} ${Math.abs(q) === 1 ? "" : Math.abs(q)}y = ${moins(r)}`;
      return { comp: "sy-systemes", enonce: `Résous le système :<div class="calc">${eq(a, b, e)}<br>${eq(c, d, f)}</div>`, type: "coeffs", modele: ["x = ", " ; y = ", ""], reponse: [x, y], affiche: `x = ${moins(x)} ; y = ${moins(y)}`,
        explication: `<b>Méthode par combinaison</b> : on élimine x.<br>1) On multiplie la 1re équation par ${par(c)} et la 2e par ${par(a)} :<br>&nbsp;&nbsp;${moins(a * c)}x + ${par(b * c)}y = ${moins(c * e)}<br>&nbsp;&nbsp;${moins(a * c)}x + ${par(a * d)}y = ${moins(a * f)}<br>2) On soustrait membre à membre : (${moins(b * c)} − ${par(a * d)})y = ${moins(c * e)} − ${par(a * f)}, soit ${moins(b * c - a * d)}y = ${moins(c * e - a * f)}, donc <b>y = ${moins(y)}</b>.<br>3) On remplace y dans la 1re équation : ${moins(a)}x + ${par(b)} × ${par(y)} = ${moins(e)} ⇔ ${moins(a)}x = ${moins(e - b * y)} ⇔ <b>x = ${moins(x)}</b>.<br>4) Vérification : ${moins(a)}×${par(x)} + ${par(b)}×${par(y)} = ${moins(e)} ✓ et ${moins(c)}×${par(x)} + ${par(d)}×${par(y)} = ${moins(f)} ✓.` };
    },
    verifier() {
      const a = nonNul(-3, 3), b = nonNul(-3, 3), x = hasard(-4, 4), y = hasard(-4, 4), ok = Math.random() < 0.5, c = a * x + b * y + (ok ? 0 : parmi([1, -1, 2]));
      return oui(`Le couple (${moins(x)} ; ${moins(y)}) est-il solution de l'équation ${poly(0, a, 0, "x")} ${b < 0 ? "−" : "+"} ${Math.abs(b) === 1 ? "" : Math.abs(b)}y = ${moins(c)} ?`, ok ? "Oui" : "Non", [ok ? "Non" : "Oui"],
        `On remplace : ${moins(a)} × ${par(x)} + ${par(b)} × ${par(y)} = ${moins(a * x + b * y)}. ${ok ? "On trouve bien " + moins(c) + " : <b>oui</b>." : "On ne trouve pas " + moins(c) + " : <b>non</b>."}`, "sy-systemes");
    },
    probleme() {
      const p1 = 400, p2 = 500, x = hasard(4, 16), y = hasard(4, 16), L = x + y, P = p1 * x + p2 * y;
      return { comp: "sy-systemes", defi: true, enonce: `Pour la fête de fin d'année à Abengourou, les 3e commandent du <b>bissap</b> (${p1} F le litre) et du <b>gnamankou</b> (${p2} F le litre) : ${L} litres pour ${P} F en tout. Combien de litres de chaque ?`,
        type: "coeffs", modele: ["bissap : ", " L ; gnamankou : ", " L"], reponse: [x, y], affiche: `${x} L de bissap et ${y} L de gnamankou`,
        explication: `Soit x les litres de bissap et y ceux de gnamankou : x + y = ${L} et ${p1}x + ${p2}y = ${P}. On remplace x = ${L} − y : ${p1}(${L} − y) + ${p2}y = ${P} ⇔ ${p2 - p1}y = ${P - p1 * L} ⇔ y = ${y}, puis x = ${x}. <b>${x} L de bissap et ${y} L de gnamankou</b>.` };
    },
    demiPlan() {
      const a = nonNul(-3, 3), b = nonNul(-3, 3), c = hasard(-5, 5), x = hasard(-3, 3), y = hasard(-3, 3), v = a * x + b * y;
      const ok = v < c;
      return oui(`Le point M(${moins(x)} ; ${moins(y)}) est-il solution de l'inéquation ${poly(0, a, 0, "x")} ${b < 0 ? "−" : "+"} ${Math.abs(b) === 1 ? "" : Math.abs(b)}y < ${moins(c)} ?`, ok ? "Oui" : "Non", [ok ? "Non" : "Oui"],
        `On calcule ${moins(a)} × ${par(x)} + ${par(b)} × ${par(y)} = ${moins(v)}. ${ok ? `${moins(v)} < ${moins(c)} : <b>oui</b>, M est dans le demi-plan solution.` : `${moins(v)} n'est pas inférieur à ${moins(c)} : <b>non</b>.`}`, "sy-systemes");
    }
  };

  const AF = {
    image() {
      const a = nonNul(-5, 5), b = hasard(-8, 8), x = hasard(-5, 5);
      return { comp: "af-affines", enonce: `f est l'application affine définie par f(x) = ${lin(a, b)}. Calcule <b>f(${moins(x)})</b>.`, type: "nombre", reponse: a * x + b, affiche: moins(a * x + b),
        explication: `f(${moins(x)}) = ${moins(a)} × ${par(x)} ${signe(b)} = ${moins(a * x)} ${signe(b)} = <b>${moins(a * x + b)}</b>.` };
    },
    antecedent() {
      const a = nonNul(-5, 5), b = hasard(-8, 8), x = hasard(-5, 5), y = a * x + b;
      return { comp: "af-affines", enonce: `f(x) = ${lin(a, b)}. Trouve le nombre dont l'image par f est <b>${moins(y)}</b>.`, type: "nombre", reponse: x, affiche: moins(x),
        explication: `On résout ${lin(a, b)} = ${moins(y)} ⇔ ${moins(a)}x = ${moins(y - b)} ⇔ x = <b>${moins(x)}</b>.` };

    determiner() {
      const a = nonNul(-4, 4), b = hasard(-6, 6), x1 = hasard(-3, 1), x2 = x1 + hasard(1, 4);
      return { comp: "af-affines", enonce: `f est une application affine telle que f(${moins(x1)}) = ${moins(a * x1 + b)} et f(${moins(x2)}) = ${moins(a * x2 + b)}. Détermine f(x).`,
        type: "coeffs", modele: ["f(x) = ", "x + ", ""], reponse: [a, b], affiche: `f(x) = ${lin(a, b)}`,
        explication: `a = ${fr("f(x₂) − f(x₁)", "x₂ − x₁")} = ${fr(moins(a * x2 + b) + " − " + par(a * x1 + b), moins(x2) + " − " + par(x1))} = ${moins(a)}. Puis b = f(${moins(x1)}) − a × ${par(x1)} = ${moins(b)}. <b>f(x) = ${lin(a, b)}</b>.` };
    },
    sens() {
      const a = parmi([-3, -2, -1, 1, 2, 3, 0]), b = hasard(-5, 5);

      return oui(`L'application affine f(x) = ${a === 0 ? moins(b) : lin(a, b)} est :`, bon, ["croissante", "décroissante", "constante"].filter(x => x !== bon),
        `Le sens de variation dépend du coefficient a${a === 0 ? " (ici a = 0)" : " = " + moins(a)} : a > 0 croissante, a < 0 décroissante, a = 0 constante. Donc f est <b>${bon}</b>.`, "af-affines");
    },
    lineaire() {
      const a = nonNul(-5, 6), x1 = hasard(2, 6), x2 = hasard(2, 9);
      return { comp: "af-affines", enonce: `f est une application <b>linéaire</b> et f(${x1}) = ${moins(a * x1)}. Calcule f(${x2}).`, type: "nombre", reponse: a * x2, affiche: moins(a * x2),
        explication: `f linéaire : f(x) = ax. Avec f(${x1}) = ${moins(a * x1)}, a = ${fr(moins(a * x1), x1)} = ${moins(a)}. Donc f(${x2}) = ${moins(a)} × ${x2} = <b>${moins(a * x2)}</b>.` };
    },
    defiSono() {
      const h = parmi([4, 5, 6]), p1 = 5000, c = 2000 * h, p2 = 7000;
      return { comp: "af-affines", defi: true, enonce: `Pour la kermesse du lycée de Korhogo, la sono coûte ${p1} F l'heure + ${c} F de caution chez le fournisseur A, et ${p2} F l'heure chez le fournisseur B. À partir de combien d'heures A devient-il plus avantageux ?`,
        type: "nombre", reponse: h, affiche: h + " heures",
        explication: `Prix A : f(x) = ${p1}x + ${c} ; prix B : g(x) = ${p2}x. Égalité : ${p1}x + ${c} = ${p2}x ⇔ ${p2 - p1}x = ${c} ⇔ x = <b>${h} heures</b>. Au-delà de ${h} h, A coûte moins cher.` };
    }
  };

  const PY = {
    pyramide() {
      const c = hasard(2, 9), h = 3 * hasard(1, 5), V = c * c * h / 3;
      return { comp: "py-volumes", enonce: `Une pyramide a une base carrée de côté ${c} cm et une hauteur de ${h} cm. Calcule son <b>volume</b> (en cm³).`, type: "nombre", reponse: V, affiche: V + " cm³",
        explication: `V = ${fr("aire de la base × hauteur", 3)} = ${fr(c + "² × " + h, 3)} = ${fr(c * c * h, 3)} = <b>${V} cm³</b>.` };
    },
    cone() {
      const r = hasard(2, 6), h = 3 * hasard(1, 4), k = r * r * h / 3;
      return { comp: "py-volumes", enonce: `Un cône de révolution a un rayon de base de ${r} cm et une hauteur de ${h} cm. Donne son volume sous la forme k × π.`, type: "coeffs", modele: ["V = ", " π cm³"], reponse: [k], affiche: `${k}π cm³`,
        explication: `V = ${fr("π × r² × h", 3)} = ${fr("π × " + r * r + " × " + h, 3)} = <b>${k}π cm³</b> (environ ${dec(Math.round(k * Math.PI * 10) / 10)} cm³).` };
    },
    reduction() {
      const k = parmi([[1, 2], [1, 3], [2, 3]]), V = k[1] ** 3 * hasard(1, 6) * 3, v = V * k[0] ** 3 / k[1] ** 3;
      return { comp: "py-volumes", enonce: `Une pyramide a un volume de ${V} cm³. On la coupe par un plan parallèle à la base : la petite pyramide obtenue est une réduction de coefficient ${fr(k[0], k[1])}. Calcule son volume.`,
        type: "nombre", reponse: v, affiche: v + " cm³",
        explication: `Dans une réduction de coefficient k, les longueurs sont multipliées par k, les aires par k² et les <b>volumes par k³</b> : v = ${V} × (${fr(k[0], k[1])})³ = ${V} × ${fr(k[0] ** 3, k[1] ** 3)} = <b>${v} cm³</b>.` };
    },
    generatrice() {
      const [a, b, c] = parmi(TRIPLETS.slice(0, 5));
      return { comp: "py-volumes", enonce: `Un cône a un rayon de ${a} cm et une hauteur de ${b} cm. Calcule la longueur de sa <b>génératrice</b>.`, type: "nombre", reponse: c, affiche: c + " cm",
        explication: `La hauteur, le rayon et la génératrice forment un triangle rectangle : g² = ${a}² + ${b}² = ${c * c}, donc g = <b>${c} cm</b>.` };

  const PCG = {
    poids() {
      const m = parmi([0.5, 2, 5, 12, 25, 50, 60, 75]);
      return { comp: "pc-calcul", enonce: `Calcule le poids (en N) d'un objet de masse ${dec(m)} kg. On prend g = 10 N/kg.`, type: "nombre", reponse: m * 10, affiche: dec(m * 10) + " N",
        explication: `P = m × g = ${dec(m)} × 10 = <b>${dec(m * 10)} N</b>. La masse s'exprime en kg, le poids en newtons (N).` };
    },
    masse() {
      const P = parmi([20, 150, 400, 650, 800]);
      return { comp: "pc-calcul", enonce: `Un corps a un poids de ${P} N. Quelle est sa masse (en kg) ? g = 10 N/kg.`, type: "nombre", reponse: P / 10, affiche: dec(P / 10) + " kg",
        explication: `m = ${fr("P", "g")} = ${fr(P, 10)} = <b>${dec(P / 10)} kg</b>.` };
    },
    travail() {
      const F = parmi([20, 50, 100, 150, 200]), L = parmi([2, 3, 5, 10, 12]);
      return { comp: "pc-calcul", enonce: `Une force constante de ${F} N déplace son point d'application de ${L} m dans sa direction et son sens. Calcule son travail (en J).`, type: "nombre", reponse: F * L, affiche: F * L + " J",
        explication: `W = F × L = ${F} × ${L} = <b>${F * L} J</b> (joules).` };
    },
    puissanceMeca() {
      const W = parmi([600, 1200, 3000, 4500]), t = parmi([2, 3, 5, 10, 15]);
      if (!Number.isInteger(W / t * 10)) return PCG.puissanceMeca();
      return { comp: "pc-calcul", enonce: `Un moteur effectue un travail de ${W} J en ${t} s. Calcule sa puissance (en W).`, type: "nombre", reponse: W / t, affiche: dec(W / t) + " W",
        explication: `P = ${fr("W", "t")} = ${fr(W, t)} = <b>${dec(W / t)} W</b> (watts).` };
    },
    energiePot() {
      const m = parmi([2, 5, 10, 20]), h = parmi([3, 5, 8, 10, 12]);
      return { comp: "pc-calcul", enonce: `Un sac de ${m} kg est posé sur un mur à ${h} m du sol. Calcule son énergie potentielle de pesanteur (sol = référence, g = 10 N/kg).`, type: "nombre", reponse: m * 10 * h, affiche: m * 10 * h + " J",
        explication: `Ep = m × g × h = ${m} × 10 × ${h} = <b>${m * 10 * h} J</b>.` };
    },
    energieCin() {
      const m = parmi([2, 4, 10, 60, 80]), v = parmi([2, 3, 5, 10]);
      return { comp: "pc-calcul", enonce: `Un corps de masse ${m} kg se déplace à ${v} m/s. Calcule son énergie cinétique (en J).`, type: "nombre", reponse: m * v * v / 2, affiche: dec(m * v * v / 2) + " J",
        explication: `Ec = ½ × m × v² = 0,5 × ${m} × ${v}² = <b>${dec(m * v * v / 2)} J</b>.` };
    },
    puissanceElec() {
      const U = parmi([12, 220, 230]), I = parmi([0.5, 2, 5, 10]);
      return { comp: "pc-calcul", enonce: `Un appareil fonctionne sous ${U} V et est traversé par un courant de ${dec(I)} A. Calcule sa puissance (en W).`, type: "nombre", reponse: U * I, affiche: dec(U * I) + " W",
        explication: `P = U × I = ${U} × ${dec(I)} = <b>${dec(U * I)} W</b>.` };
    },
    energieElec() {
      const P = parmi([100, 500, 1000, 1500, 2000]), t = parmi([2, 3, 4, 5]);
      return { comp: "pc-calcul", enonce: `Un fer à repasser de ${P} W fonctionne pendant ${t} h. Calcule l'énergie consommée en kWh.`, type: "nombre", reponse: P * t / 1000, affiche: dec(P * t / 1000) + " kWh",
        explication: `E = P × t = ${P} W × ${t} h = ${P * t} Wh = <b>${dec(P * t / 1000)} kWh</b> (1 kWh = 1 000 Wh).` };
    },
    ohm() {
      const R = parmi([10, 20, 47, 100, 220]), I = parmi([0.1, 0.2, 0.5]), cas = hasard(0, 1);
      const U = Math.round(R * I * 100) / 100;
      return cas ? { comp: "pc-calcul", enonce: `Un conducteur ohmique de résistance ${R} Ω est traversé par un courant de ${dec(I)} A. Calcule la tension U à ses bornes (en V).`, type: "nombre", reponse: U, affiche: dec(U) + " V",
        explication: `Loi d'Ohm : U = R × I = ${R} × ${dec(I)} = <b>${dec(U)} V</b>.` }
        : { comp: "pc-calcul", enonce: `La tension aux bornes d'un conducteur ohmique est ${dec(U)} V et l'intensité ${dec(I)} A. Calcule sa résistance (en Ω).`, type: "nombre", reponse: R, affiche: R + " Ω",
        explication: `R = ${fr("U", "I")} = ${fr(dec(U), dec(I))} = <b>${R} Ω</b>.` };
    },
    serie() {
      const R1 = parmi([10, 22, 47, 100]), R2 = parmi([10, 33, 68, 150]);
      return { comp: "pc-calcul", enonce: `Deux conducteurs ohmiques de ${R1} Ω et ${R2} Ω sont montés en <b>série</b>. Quelle est la résistance équivalente ?`, type: "nombre", reponse: R1 + R2, affiche: (R1 + R2) + " Ω",
        explication: `En série, les résistances s'additionnent : R = R₁ + R₂ = ${R1} + ${R2} = <b>${R1 + R2} Ω</b>.` };
    },
    vergence() {
      const f = parmi([0.1, 0.2, 0.25, 0.5, 0.05]);
      return { comp: "pc-calcul", enonce: `Une lentille convergente a une distance focale de ${dec(f * 100)} cm. Calcule sa vergence (en dioptries).`, type: "nombre", reponse: 1 / f, affiche: dec(1 / f) + " δ",
        explication: `C = ${fr(1, "f")} avec f en <b>mètres</b> : f = ${dec(f)} m, donc C = ${fr(1, dec(f))} = <b>${dec(1 / f)} δ</b>.` };
    },
    electrolyse() {
      const v = parmi([5, 8, 10, 12, 15]);
      return { comp: "pc-calcul", enonce: `Lors de l'électrolyse de l'eau, on recueille ${v} cm³ de dioxygène. Quel volume de dihydrogène obtient-on en même temps ?`, type: "nombre", reponse: 2 * v, affiche: 2 * v + " cm³",
        explication: `Le volume de dihydrogène est le <b>double</b> de celui du dioxygène : 2 × ${v} = <b>${2 * v} cm³</b> (2H₂O → 2H₂ + O₂).` };
    }
  };

  function comparerDictee(attendu, saisi) {
    const a = normaliserMots(attendu), b = normaliserMots(saisi);
    const L = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
    for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const ok = new Array(a.length).fill(false); let i = 0, j = 0;
    while (i < a.length && j < b.length) { if (a[i] === b[j]) { ok[i] = true; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
    const erreurs = Math.max(a.length, b.length) - L[0][0];
    let k = 0;

      if (!normaliserMots(brut).length) return brut;
      const bon = ok[k++];

    return { erreurs, rendu };
