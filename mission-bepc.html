  const PEAUX = ["#6B3E22", "#7B4A2A", "#5A3219", "#8A5533"];
  // Un personnage dessiné, pieds en (x, y)
  function perso(x, y, o = {}) {
    const s = o.s || 1, pe = o.peau || PEAUX[0], h = o.haut || "#E0701F", b = o.bas || "#2B4C7E";
    const tY = y - 62 * s, epaule = y - 50 * s, taille = y - 27 * s;
    const bras = { bas: [[-9, 22, -11, 0], [9, 22, 11, 0]], haut: [[-9, -26, -14, 0], [9, -26, 14, 0]], droit: [[-9, 22, -11, 0], [9, -26, 16, 0]], gauche: [[-9, -26, -16, 0], [9, 22, 11, 0]],
      avant: [[-9, 22, -11, 0], [9, 4, 24, 0]], tient: [[-9, 4, -18, 0], [9, 4, 18, 0]], tete: [[-9, -20, -6, 0], [9, -20, 6, 0]] }[o.bras || "bas"];
    let svg = "";
    if (o.robe) svg += `<path d="M${x - 9 * s} ${epaule} h${18 * s} l${6 * s} ${34 * s} h${-30 * s} z" fill="${h}"/>`;
    else svg += `<rect x="${x - 9 * s}" y="${epaule}" width="${18 * s}" height="${24 * s}" rx="${4 * s}" fill="${h}"/>`;
    if (!o.assis) svg += `<rect x="${x - 8 * s}" y="${o.robe ? y - 16 * s : taille}" width="${7 * s}" height="${o.robe ? 16 * s : 27 * s}" fill="${o.robe ? pe : b}"/><rect x="${x + 1 * s}" y="${o.robe ? y - 16 * s : taille}" width="${7 * s}" height="${o.robe ? 16 * s : 27 * s}" fill="${o.robe ? pe : b}"/>`;
    for (const [dx, dy, ex, ey] of bras) svg += `<line x1="${x + dx * s}" y1="${epaule + 3 * s}" x2="${x + (dx + ex) * s}" y2="${epaule + 3 * s + dy * s + ey}" stroke="${pe}" stroke-width="${4.5 * s}" stroke-linecap="round"/>`;
    svg += `<rect x="${x - 3 * s}" y="${tY + 7 * s}" width="${6 * s}" height="${6 * s}" fill="${pe}"/><circle cx="${x}" cy="${tY}" r="${9 * s}" fill="${pe}"/>`;
    if (o.foulard) svg += `<path d="M${x - 10 * s} ${tY - 1 * s} a${10 * s} ${10 * s} 0 0 1 ${20 * s} 0 z" fill="${o.foulard}"/>`;
    if (o.cheveux) svg += `<path d="M${x - 9 * s} ${tY - 2 * s} a${9 * s} ${9 * s} 0 0 1 ${18 * s} 0 q${-9 * s} ${-4 * s} ${-18 * s} 0z" fill="#1d130c"/>`;
    if (o.sac) svg += `<rect x="${x + 10 * s}" y="${epaule + 10 * s}" width="${12 * s}" height="${14 * s}" rx="${2 * s}" fill="${o.sac}"/>`;
    if (o.panier) svg += `<path d="M${x - 14 * s} ${tY - 9 * s} h${28 * s} l${-4 * s} ${-9 * s} h${-20 * s} z" fill="#B7843F"/>` + (o.panier === "cabosses" ? `<ellipse cx="${x - 5 * s}" cy="${tY - 19 * s}" rx="${5 * s}" ry="${3 * s}" fill="#E3A21A"/><ellipse cx="${x + 5 * s}" cy="${tY - 19 * s}" rx="${5 * s}" ry="${3 * s}" fill="#D9861C"/>` : "");
    return svg;
  }

  // Choisit, dans la fiche de cours, le paragraphe le plus proche d'une question (rappel de cours pour la correction)
  const MOTS_VIDES = new Set("les des une dans pour avec sont est que qui par sur aux ces son ses leur plus pas the and are this that elle ils nous vous tout toute tous quel quelle quand comme donc mais car était être avoir fait faire".split(" "));
  const motsCles = t => new Set(String(t).replace(/<[^>]+>/g, " ").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9]+/).filter(m => m.length > 3 && !MOTS_VIDES.has(m)));
  function blocsCours(cours) {
    const blocs = []; const re = /<div class="regle"><b>([\s\S]*?)<\/b>([\s\S]*?)<\/div>/g; let m;
    while ((m = re.exec(cours))) blocs.push({ titre: m[1], texte: m[2], mots: motsCles(m[1] + " " + m[2]) });
    return blocs;
  }
  function meilleurRappel(blocs, item) {
    const mots = motsCles(item.join(" "));
    let best = null, score = 0;
    for (const b of blocs) { let s = 0; for (const m of mots) if (b.mots.has(m)) s++; if (s > score) { score = s; best = b; } }
    return best || blocs[0] || null;
  }

    angles: E(`A, B, C sont sur un cercle de centre O. L'angle au centre AÔB mesure 110°. Calcule l'angle inscrit AĈB (C sur le grand arc).`,
      [`<b>Repérer l'arc</b> : AĈB et AÔB interceptent le même arc AB.`,
       `<b>Propriété</b> : un angle inscrit mesure la moitié de l'angle au centre associé.`,
       `<b>Calcul</b> : AĈB = 110° ÷ 2 = <b>55°</b>.`], "Justifie toujours avec la propriété : « AĈB est un angle inscrit qui intercepte le même arc que l'angle au centre AÔB »."),
    vecteurs: E(`Réduis u⃗ = AB⃗ + CA⃗ − CB⃗.`,
      [`<b>Réordonner</b> : u⃗ = CA⃗ + AB⃗ − CB⃗.`,
       `<b>Chasles</b> : CA⃗ + AB⃗ = CB⃗.`,
       `<b>Conclusion</b> : u⃗ = CB⃗ − CB⃗ = <b>0⃗</b>.`], "On peut changer l'ordre d'une somme de vecteurs, mais pas les lettres à l'intérieur d'un vecteur."),
    equations: E(`Résous dans ℝ : 3x − 5 ≤ 7x + 3. Donne l'ensemble des solutions.`,
      [`<b>Regrouper</b> : 3x − 7x ≤ 3 + 5, soit −4x ≤ 8.`,
       `<b>Diviser par −4</b> (négatif) : on <b>change le sens</b> : x ≥ ${fr(8, "−4")} = −2.`,
       `<b>Ensemble des solutions</b> : <b>[−2 ; +∞[</b> (crochet fermé en −2 car ≥).`], "Le sens change seulement quand on multiplie ou divise par un NÉGATIF."),
    coordonnees: E(`Dans un repère orthonormé, A(−2 ; 1) et B(4 ; 9). Calcule les coordonnées de AB⃗, du milieu I de [AB], puis la distance AB.`,
      [`<b>Vecteur</b> : AB⃗ (4 − (−2) ; 9 − 1) = <b>(6 ; 8)</b>.`,
       `<b>Milieu</b> : I (${fr("−2 + 4", 2)} ; ${fr("1 + 9", 2)}) = <b>I(1 ; 5)</b>.`,
       `<b>Distance</b> : AB = ${rac("6² + 8²")} = ${rac(100)} = <b>10</b>.`], "« Arrivée moins départ » : B − A, attention aux signes moins."),
    droites: E(`Détermine l'équation de la droite (AB) avec A(1 ; 3) et B(3 ; 7).`,
      [`<b>Coefficient directeur</b> : a = ${fr("7 − 3", "3 − 1")} = ${fr(4, 2)} = 2.`,
       `<b>Ordonnée à l'origine</b> : A est sur la droite, donc 3 = 2 × 1 + b, d'où b = 1.`,
       `<b>Équation</b> : <b>y = 2x + 1</b>. Vérification avec B : 2 × 3 + 1 = 7 ✓.`], "Vérifie toujours avec le deuxième point."),
    stats: E(`Âges de 20 élèves : 13 ans (4 élèves), 14 ans (9), 15 ans (5), 16 ans (2). Calcule la moyenne et la médiane.`,
      [`<b>Moyenne</b> : ${fr("13 × 4 + 14 × 9 + 15 × 5 + 16 × 2", 20)} = ${fr("52 + 126 + 75 + 32", 20)} = ${fr(285, 20)} = <b>14,25 ans</b>.`,
       `<b>Effectifs cumulés croissants</b> : 4 ; 13 ; 18 ; 20.`,
       `<b>Médiane</b> : 20 valeurs, on regarde les 10e et 11e ; elles sont dans la valeur 14 (cumul 13). Médiane = <b>14 ans</b>.`], "Divise par l'effectif total (20), pas par 4."),
    systemes: E(`Résous : x + y = 12 et 2x − y = 3.`,
      [`<b>Combinaison</b> : additionne les deux équations, les y s'éliminent : 3x = 15, donc <b>x = 5</b>.`,
       `<b>Remplacer</b> dans x + y = 12 : 5 + y = 12, donc <b>y = 7</b>.`,
       `<b>Vérifier</b> : 5 + 7 = 12 ✓ et 2 × 5 − 7 = 3 ✓. Solution : le couple <b>(5 ; 7)</b>.`], "La vérification dans les deux équations est indispensable."),
    affines: E(`f est affine avec f(1) = 5 et f(3) = 11. Détermine f(x), puis son sens de variation.`,
      [`<b>Coefficient</b> : a = ${fr("f(3) − f(1)", "3 − 1")} = ${fr("11 − 5", 2)} = 3.`,
       `<b>b</b> : f(1) = 3 × 1 + b = 5, donc b = 2. <b>f(x) = 3x + 2</b>.`,
       `<b>Sens de variation</b> : a = 3 > 0, donc f est <b>croissante</b>.`], "Vérifie : f(3) = 9 + 2 = 11 ✓."),
    pyramides: E(`Une pyramide a une base carrée de 6 cm de côté et une hauteur de 10 cm. Calcule son volume. On la coupe à mi-hauteur parallèlement à la base : volume de la petite pyramide ?`,
      [`<b>Aire de la base</b> : 6 × 6 = 36 cm².`,
       `<b>Volume</b> : V = ${fr("36 × 10", 3)} = <b>120 cm³</b>.`,
       `<b>Réduction</b> : à mi-hauteur, k = ${fr(1, 2)} ; les volumes sont multipliés par k³ = ${fr(1, 8)}.`,
       `<b>Petite pyramide</b> : 120 × ${fr(1, 8)} = <b>15 cm³</b>.`], "Volumes × k³, pas × k."),
    // ---------------- SVT ----------------
    "svt-aliments": E("Un élève mange chaque jour du riz et du pain seulement. Son repas est-il équilibré ? Justifie.",
      ["<b>Identifier</b> : riz et pain sont riches en glucides : ce sont des aliments énergétiques.", "<b>Ce qui manque</b> : des aliments bâtisseurs (protides : poisson, viande, œufs, haricots) et fonctionnels (vitamines, sels minéraux : fruits et légumes).", "<b>Conclusion</b> : le repas n'est <b>pas équilibré</b> ; il risque des carences (kwashiorkor, anémie…). Il faut ajouter poisson et légumes."],
      "Un repas équilibré contient les trois groupes d'aliments, pas seulement « beaucoup »."),
    "svt-digestion": E("Dans un tube à 37 °C, on met de l'empois d'amidon et de la salive. Après 15 min, l'eau iodée ne bleuit plus et la liqueur de Fehling donne un précipité rouge brique. Interprète.",
      ["<b>Eau iodée négative</b> : l'amidon a disparu.", "<b>Fehling positif</b> : il est apparu un sucre réducteur (maltose).", "<b>Interprétation</b> : une enzyme de la salive, l'<b>amylase</b>, a transformé l'amidon en maltose à 37 °C : c'est une digestion chimique."],
      "Décris d'abord les résultats (ce qu'on voit), puis interprète (ce que ça veut dire)."),
    "svt-sang": E("Un enfant fatigué et pâle a une analyse de sang : 2,5 millions de globules rouges par mm³ (normal : 4 à 5 millions). Que conclure ?",
      ["<b>Comparer</b> : 2,5 millions est bien inférieur à la normale.", "<b>Rôle des globules rouges</b> : ils transportent le dioxygène grâce à l'hémoglobine.", "<b>Conclusion</b> : l'enfant a une <b>anémie</b> ; ses organes reçoivent moins de dioxygène, d'où la fatigue. Causes possibles : paludisme, manque de fer."],
      "Utilise toujours les valeurs normales pour comparer."),
    "svt-transfusion": E("Kouassi est du groupe B Rh+. Peut-il recevoir du sang A Rh+ ? Et du sang O Rh− ?",
      ["<b>Son plasma</b> : groupe B → anticorps <b>anti-A</b>.", "<b>Sang A</b> : ses hématies portent l'antigène A → agglutination avec les anti-A : <b>impossible</b>.", "<b>Sang O Rh−</b> : pas d'antigène A, B ni D → <b>possible</b> (O− est donneur universel)."],
      "Regarde les ANTIGÈNES du donneur et les ANTICORPS du receveur."),
    "svt-circulation": E("Décris le trajet d'une goutte de sang qui part du ventricule droit jusqu'à l'aorte.",
      ["<b>Petite circulation</b> : ventricule droit → artère pulmonaire → poumons (le sang se charge en O₂) → veines pulmonaires → oreillette gauche.", "<b>Cœur gauche</b> : oreillette gauche → ventricule gauche.", "<b>Grande circulation</b> : ventricule gauche → <b>aorte</b> → organes."],
      "Artère = part du cœur ; veine = revient au cœur, quelle que soit la richesse en O₂."),
    "svt-grossesse": E("Aminata, 15 ans, pense qu'on ne peut pas tomber enceinte au premier rapport. Que lui répondre ?",
      ["<b>Rétablir la vérité</b> : une grossesse est possible dès le premier rapport, s'il a lieu en période féconde (autour de l'ovulation).", "<b>Risques</b> : grossesse précoce, abandon scolaire, avortement dangereux, IST et VIH.", "<b>Conseils</b> : abstinence ou report des rapports, dialogue avec un adulte de confiance, conseils d'un centre de santé (le préservatif protège aussi des IST)."],
      "Réponds avec des arguments scientifiques, sans jugement."),
    "svt-vih": E("Explique pourquoi une personne atteinte du sida tombe souvent malade.",
      ["<b>Le virus</b> : le VIH détruit les lymphocytes T4, qui dirigent les défenses de l'organisme.", "<b>Conséquence</b> : le système immunitaire s'affaiblit progressivement.", "<b>Au stade sida</b> : l'organisme ne se défend plus contre des microbes habituellement peu dangereux : ce sont les <b>maladies opportunistes</b> (tuberculose, diarrhées…)."],
      "Le VIH ne tue pas directement : ce sont les maladies opportunistes."),
    "svt-sol": E("On verse 100 mL d'eau sur 100 g de sol sableux et 100 g de sol argileux. On recueille 80 mL pour le sable et 20 mL pour l'argile en 10 minutes. Interprète.",
      ["<b>Comparer</b> : le sable laisse passer 80 mL, l'argile seulement 20 mL.", "<b>Interpréter</b> : le sol sableux est très <b>perméable</b> (gros grains, grands espaces) ; le sol argileux retient l'eau (particules fines).", "<b>Conséquence</b> : le sol sableux sèche vite et perd ses sels minéraux ; le sol argileux garde l'eau mais peut être asphyxiant."],
      "Donne toujours les chiffres dans ta comparaison."),
    "svt-sol-plantes": E("Pourquoi un plant de maïs flétrit-il quand on coupe l'extrémité de ses racines ?",
      ["<b>Rôle des racines</b> : l'eau et les sels minéraux sont absorbés par les <b>poils absorbants</b>, près de l'extrémité des racines.", "<b>En les coupant</b>, on supprime les poils absorbants.", "<b>Conséquence</b> : la plante n'absorbe plus assez d'eau, la sève brute ne monte plus : elle <b>flétrit</b>."],
      "Relie toujours la structure (poils absorbants) à la fonction (absorption)."),
    "svt-degradation": E("Sur une pente cultivée sans arbres, la terre est emportée à chaque pluie. Nomme le phénomène et explique-le.",
      ["<b>Nom</b> : l'<b>érosion hydrique</b>.", "<b>Explication</b> : sans végétation, rien ne freine l'eau de ruissellement ni ne retient la terre ; sur une pente, l'eau va vite et arrache la couche fertile.", "<b>Conséquence</b> : le sol s'appauvrit et les récoltes diminuent."],
      "Cite la cause humaine (pas d'arbres) et la cause naturelle (pluie + pente)."),
    "svt-protection": E("Propose trois techniques pour protéger et améliorer ce champ en pente.",
      ["<b>Protéger</b> : cultiver en <b>terrasses</b> ou selon les courbes de niveau pour freiner l'eau.", "<b>Retenir le sol</b> : planter des arbres et des haies (agroforesterie), pratiquer le paillage.", "<b>Améliorer</b> : apporter du <b>compost</b> ou du fumier, pratiquer la jachère et la rotation des cultures."],
      "Distingue protéger (contre l'érosion) et améliorer (la fertilité)."),
    // ---------------- Physique-Chimie ----------------
    "pc-masse": E("Un sac de riz a une masse de 25 kg. Calcule son poids sur Terre (g = 10 N/kg) puis sur la Lune (g = 1,6 N/kg).",
      ["<b>Formule</b> : P = m × g.", "<b>Sur Terre</b> : P = 25 × 10 = <b>250 N</b>.", "<b>Sur la Lune</b> : P = 25 × 1,6 = <b>40 N</b>. La masse reste 25 kg."],
      "La masse (kg) ne change pas ; le poids (N) change avec le lieu."),
    "pc-forces": E("Une lampe de poids 6 N est accrochée à un fil. Donne les caractéristiques du poids et représente-le à l'échelle 1 cm pour 2 N.",
      ["<b>Point d'application</b> : le centre de gravité G de la lampe.", "<b>Direction</b> : verticale ; <b>sens</b> : vers le bas ; <b>intensité</b> : 6 N.", "<b>Longueur de la flèche</b> : 6 ÷ 2 = <b>3 cm</b>, partant de G vers le bas."],
      "Donne les 4 caractéristiques, dans l'ordre."),
    "pc-equilibre": E("Un objet de masse 2 kg est suspendu à un fil et immobile. Calcule la tension du fil (g = 10 N/kg).",
      ["<b>Bilan des forces</b> : le poids P⃗ et la tension T⃗ du fil.", "<b>Équilibre</b> : P⃗ + T⃗ = 0⃗ : même droite d'action, sens contraires, même intensité.", "<b>Calcul</b> : P = 2 × 10 = 20 N, donc <b>T = 20 N</b>, verticale vers le haut."],
      "À l'équilibre, les deux forces se COMPENSENT."),
    "pc-travail": E("Un ouvrier monte un sac de 40 kg à 5 m de hauteur en 20 s. Calcule le travail et la puissance (g = 10 N/kg).",
      ["<b>Force</b> : il doit vaincre le poids : P = 40 × 10 = 400 N.", "<b>Travail</b> : W = F × L = 400 × 5 = <b>2 000 J</b>.", "<b>Puissance</b> : P = W / t = 2 000 / 20 = <b>100 W</b>."],
      "Ne confonds pas le poids P (en N) et la puissance P (en W)."),
    "pc-energie": E("Une mangue de 0,2 kg tombe d'une branche à 5 m. Calcule son énergie potentielle au départ, puis sa vitesse en arrivant au sol (sans frottements, g = 10 N/kg).",
      ["<b>Départ</b> : Ep = m g h = 0,2 × 10 × 5 = <b>10 J</b> ; Ec = 0 (immobile).", "<b>Conservation</b> : sans frottements, au sol toute l'énergie est cinétique : Ec = 10 J.", "<b>Vitesse</b> : ½ × 0,2 × v² = 10 ⇒ v² = 100 ⇒ <b>v = 10 m/s</b>."],
      "Masse en kg et hauteur en m."),
    "pc-electrolyse": E("On réalise l'électrolyse de l'eau et on recueille 12 cm³ de dioxygène. Quel volume de dihydrogène ? À quelle électrode ? Écris l'équation.",
      ["<b>Rapport des volumes</b> : V(H₂) = 2 × V(O₂) = 2 × 12 = <b>24 cm³</b>.", "<b>Électrode</b> : le dihydrogène se dégage à la <b>cathode</b> (borne −).", "<b>Équation</b> : <b>2 H₂O → 2 H₂ + O₂</b>."],
      "Double volume = dihydrogène."),
    "pc-alcanes": E("Écris et équilibre l'équation de la combustion complète du propane C₃H₈.",
      ["<b>Réactifs et produits</b> : C₃H₈ + O₂ → CO₂ + H₂O.", "<b>Carbone et hydrogène</b> : 3 C → 3 CO₂ ; 8 H → 4 H₂O.", "<b>Oxygène</b> : à droite 3 × 2 + 4 × 1 = 10 atomes O, donc 5 O₂. Équation : <b>C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O</b>."],
      "Équilibre C, puis H, puis O en dernier."),
    "pc-lentilles": E("Une lentille convergente a une distance focale de 20 cm. Calcule sa vergence.",
      ["<b>Convertir</b> : f = 20 cm = 0,20 m.", "<b>Formule</b> : C = 1 / f.", "<b>Calcul</b> : C = 1 / 0,20 = <b>5 δ</b> (dioptries)."],
      "La distance focale doit être en MÈTRES."),
    "pc-oeil": E("Awa voit bien de près mais flou de loin. Quel est son défaut ? Où se forme l'image ? Quelle correction ?",
      ["<b>Défaut</b> : voir mal de loin, c'est la <b>myopie</b>.", "<b>Image</b> : elle se forme <b>en avant de la rétine</b> (œil trop convergent).", "<b>Correction</b> : une lentille <b>divergente</b>."],
      "Myopie → divergente ; hypermétropie et presbytie → convergente."),
    "pc-oxydation": E("On brûle 5,6 g de fer dans du dioxygène. Écris l'équation et nomme le produit.",
      ["<b>Réactifs</b> : fer (Fe) et dioxygène (O₂).", "<b>Produit</b> : l'oxyde magnétique de fer Fe₃O₄ (grains noirs).", "<b>Équation</b> : <b>3 Fe + 2 O₂ → Fe₃O₄</b> (3 Fe et 4 O de chaque côté)."],
      "Compte les atomes de chaque côté pour vérifier."),
    "pc-reduction": E("On chauffe un mélange d'oxyde de cuivre (CuO) et de carbone. On obtient du cuivre et un gaz qui trouble l'eau de chaux. Écris l'équation, nomme l'oxydant et le réducteur.",
      ["<b>Produits</b> : cuivre Cu et dioxyde de carbone CO₂ (il trouble l'eau de chaux).", "<b>Équation</b> : <b>2 CuO + C → 2 Cu + CO₂</b>.", "<b>Rôles</b> : le carbone capte l'oxygène, c'est le <b>réducteur</b> ; CuO cède son oxygène, il est <b>réduit</b> (c'est l'oxydant)."],
      "Le réducteur est celui qui GAGNE l'oxygène."),
    "pc-solutions": E("Trois solutions ont pour pH : A = 2, B = 7, C = 12. Classe-les et indique la couleur du BBT dans chacune.",
      ["<b>A (pH 2 < 7)</b> : acide → BBT <b>jaune</b>.", "<b>B (pH 7)</b> : neutre → BBT <b>vert</b>.", "<b>C (pH 12 > 7)</b> : basique → BBT <b>bleu</b>."],
      "Plus le pH est petit, plus la solution est acide."),
    "pc-puissance-elec": E("Un ventilateur porte « 220 V – 55 W ». Calcule l'intensité, puis l'énergie consommée en 8 h (en kWh).",
      ["<b>Intensité</b> : P = U × I ⇒ I = P / U = 55 / 220 = <b>0,25 A</b>.", "<b>Énergie</b> : E = P × t = 55 W × 8 h = 440 Wh.", "<b>Conversion</b> : 440 Wh = <b>0,44 kWh</b>."],
      "Pour obtenir des kWh : P en kW et t en heures (ou Wh ÷ 1 000)."),
    "pc-ohm": E("Une résistance de 47 Ω est traversée par un courant de 0,2 A. Calcule la tension. Puis on l'associe en série avec 33 Ω : résistance équivalente ?",
      ["<b>Loi d'Ohm</b> : U = R × I = 47 × 0,2 = <b>9,4 V</b>.", "<b>En série</b> : R = R₁ + R₂ = 47 + 33 = <b>80 Ω</b>."],
      "I en ampères : 200 mA = 0,2 A."),
    // ---------------- Histoire-Géographie ----------------
    "hg-colonisation": E("Question type : « Explique les causes de la colonisation de la Côte d'Ivoire à la fin du XIXe siècle. »",
      ["<b>Introduction</b> : à la fin du XIXe siècle, les puissances européennes se partagent l'Afrique (conférence de Berlin, 1884-1885).", "<b>Causes économiques</b> : recherche de matières premières (bois, café, cacao) et de débouchés pour les industries.", "<b>Causes politiques et idéologiques</b> : puissance, prestige et prétendue « mission civilisatrice ».", "<b>Conclusion</b> : la colonie de Côte d'Ivoire est créée le 10 mars 1893."],
      "Classe les causes par type : économiques, politiques, idéologiques."),
    "hg-independance": E("Question type : « Présente les étapes de l'accession de la Côte d'Ivoire à l'indépendance. »",
      ["<b>1944-1946</b> : SAA (1944), loi Houphouët-Boigny abolissant le travail forcé (11 avril 1946), création du PDCI et du RDA.", "<b>1956</b> : loi-cadre Defferre, autonomie interne.", "<b>1958</b> : référendum du 28 septembre, République proclamée le 4 décembre.", "<b>1960</b> : indépendance le <b>7 août 1960</b>."],
      "Une chronologie claire avec les dates rapporte beaucoup de points."),
    "hg-crises": E("Question type : « Donne deux causes et deux conséquences des crises sociopolitiques en Afrique. »",
      ["<b>Causes</b> : la mauvaise gouvernance (corruption, injustice) ; l'ethnicisme et la manipulation des identités.", "<b>Conséquences</b> : des pertes en vies humaines ; des réfugiés et un recul économique.", "<b>Exemple</b> : génocide des Tutsi au Rwanda (1994), crise post-électorale ivoirienne (2010-2011)."],
      "Illustre toujours avec un exemple précis et daté."),
    "hg-ww2": E("Question type : « Quelles sont les conséquences de la Seconde Guerre mondiale ? »",
      ["<b>Humaines</b> : 50 à 60 millions de morts, dont 6 millions de Juifs (Shoah).", "<b>Économiques</b> : Europe ruinée, reconstruction avec l'aide américaine.", "<b>Politiques</b> : création de l'ONU (1945), début de la guerre froide, accélération de la décolonisation en Afrique."],
      "Organise ta réponse en trois types de conséquences."),
    "hg-onu": E("Question type : « Présente le Conseil de sécurité de l'ONU. »",
      ["<b>Composition</b> : 15 membres, dont 5 permanents (Chine, États-Unis, France, Royaume-Uni, Russie) et 10 élus pour 2 ans.", "<b>Rôle</b> : maintenir la paix et la sécurité internationales (sanctions, casques bleus).", "<b>Particularité</b> : les membres permanents ont un <b>droit de veto</b>."],
      "Composition, rôle, particularité : un plan simple et efficace."),
    "hg-ua": E("Question type : « Compare l'OUA et l'UA. »",
      ["<b>OUA</b> : créée le 25 mai 1963 à Addis-Abeba, pour libérer l'Afrique de la colonisation et défendre l'unité.", "<b>UA</b> : lancée en 2002 à Durban ; elle vise aussi la paix, la démocratie et le développement (Agenda 2063, ZLECAf).", "<b>Point commun</b> : siège à Addis-Abeba."],
      "Comparer = dire les ressemblances ET les différences."),
    "hg-atouts": E("Question type : « Montre que la Côte d'Ivoire dispose d'atouts naturels pour son développement. »",
      ["<b>Climat</b> : équatorial au sud, tropical au nord : variété de cultures.", "<b>Sols et végétation</b> : sols forestiers fertiles (cacao, café, hévéa), savane (coton, anacarde).", "<b>Eaux et sous-sol</b> : fleuves (barrages de Kossou, Soubré), or, manganèse, pétrole (gisement Baleine)."],
      "Un atout = une ressource + à quoi elle sert."),
    "hg-secteurs": E("Question type : « Classe ces activités par secteur : culture du cacao, chocolaterie, port de San-Pedro. »",
      ["<b>Primaire</b> : culture du cacao (on exploite la nature).", "<b>Secondaire</b> : chocolaterie (on transforme).", "<b>Tertiaire</b> : port de San-Pedro (service de transport)."],
      "Primaire = produire, secondaire = transformer, tertiaire = servir."),
    "hg-problemes": E("Question type : « Donne deux problèmes du développement économique ivoirien et deux solutions. »",
      ["<b>Problème 1</b> : dépendance aux cours mondiaux du cacao (prix au planteur passé de 2 800 à 1 200 F/kg en 2026). <b>Solution</b> : diversifier et transformer sur place.", "<b>Problème 2</b> : chômage des jeunes. <b>Solution</b> : formation professionnelle et soutien à l'entrepreneuriat."],
      "Associe chaque solution à un problème précis."),
    "hg-afrique": E("Question type : « Quelle est la place de l'Afrique dans le commerce mondial ? »",
      ["<b>Constat</b> : environ 3 % du commerce mondial : une place faible.", "<b>Nature des échanges</b> : exportations de matières premières, importations de produits manufacturés.", "<b>Perspectives</b> : la ZLECAf veut développer le commerce entre pays africains."],
      "Donne un chiffre, une explication et une perspective."),
    // ---------------- EDHC ----------------
    "edhc-parents": E("Situation : le père de Koffi refuse de l'inscrire à l'école et l'envoie au champ. Qu'en penses-tu ?",

  const doc = (titre, html) => `<div class="document"><span class="etiquette">${titre}</span>${html}</div>`;
  const Q = (num, enonce, points, corrige) => ({ num, enonce, points, corrige });
  const SUJETS = [
    { id: "maths-a", matiere: "maths", titre: "Mathématiques · Sujet A", duree: "2 h",
      consignes: "La calculatrice scientifique est autorisée. Soigne la rédaction : chaque résultat doit être justifié.",
      questions: [
        Q("Exercice 1", `Réponds par <b>Vrai</b> ou <b>Faux</b> en justifiant : a) ${rac("16 + 9")} = ${rac(16)} + ${rac(9)} ; b) (x − 3)² = x² − 6x + 9 ; c) le nombre 5 appartient à ]−2 ; 5] ; d) la fonction f(x) = −2x + 3 est croissante.`, 4,
          `<b>a) Faux.</b> ${rac("16 + 9")} = ${rac(25)} = 5, alors que ${rac(16)} + ${rac(9)} = 4 + 3 = 7. On ne peut pas « couper » une racine d'une somme. (1 pt)<br><b>b) Vrai.</b> Identité (a − b)² = a² − 2ab + b² avec a = x, b = 3 : x² − 6x + 9. (1 pt)<br><b>c) Vrai.</b> Le crochet « ] » après 5 est tourné vers 5 : 5 est compris. (1 pt)<br><b>d) Faux.</b> Le coefficient a = −2 est négatif : f est <b>décroissante</b>. (1 pt)`),
        Q("Exercice 2 · 1)", "On donne A = (2x − 3)² − (x + 1)². Développe et réduis A.", 1.5,
          `(2x − 3)² = 4x² − 12x + 9 et (x + 1)² = x² + 2x + 1.<br>A = 4x² − 12x + 9 − (x² + 2x + 1) = 4x² − 12x + 9 − x² − 2x − 1 = <b>3x² − 14x + 8</b>.<br><i>Piège : les parenthèses après le signe « − » changent tous les signes.</i>`),
        Q("Exercice 2 · 2)", "Factorise A.", 1.5,
          `A est de la forme a² − b² avec a = 2x − 3 et b = x + 1.<br>A = [(2x − 3) − (x + 1)] × [(2x − 3) + (x + 1)] = (2x − 3 − x − 1)(2x − 3 + x + 1) = <b>(x − 4)(3x − 2)</b>.<br>Vérification : (x − 4)(3x − 2) = 3x² − 2x − 12x + 8 = 3x² − 14x + 8 ✓.`),
        Q("Exercice 2 · 3)", "Résous l'équation A = 0.", 1,
          `On utilise la forme factorisée : (x − 4)(3x − 2) = 0. Un produit est nul si l'un des facteurs est nul :<br>x − 4 = 0 ⇔ x = 4 ; ou 3x − 2 = 0 ⇔ x = ${fr(2, 3)}.<br>Les solutions sont <b>4 et ${fr(2, 3)}</b>.`),
        Q("Exercice 2 · 4)", `Calcule A pour x = ${rac(2)}.`, 1,
          `On utilise la forme développée : A = 3 × (${rac(2)})² − 14${rac(2)} + 8 = 3 × 2 − 14${rac(2)} + 8 = <b>14 − 14${rac(2)}</b>.`),
        Q("Exercice 3 · 1)", "ABC est un triangle tel que AB = 6 cm, AC = 8 cm, BC = 10 cm. Démontre que ABC est rectangle en A.", 1.5,
          `[BC] est le plus grand côté. BC² = 10² = 100. AB² + AC² = 36 + 64 = 100.<br>Comme BC² = AB² + AC², d'après la <b>réciproque de la propriété de Pythagore</b>, le triangle ABC est rectangle en A.`),
        Q("Exercice 3 · 2)", "M est le point de [AB] tel que AM = 3 cm. La parallèle à (BC) passant par M coupe [AC] en N. Calcule AN et MN.", 2,
          `M ∈ [AB], N ∈ [AC] et (MN) // (BC) : d'après la <b>propriété de Thalès</b>, ${fr("AM", "AB")} = ${fr("AN", "AC")} = ${fr("MN", "BC")}, soit ${fr(3, 6)} = ${fr("AN", 8)} = ${fr("MN", 10)}.<br>AN = ${fr("3 × 8", 6)} = <b>4 cm</b> ; MN = ${fr("3 × 10", 6)} = <b>5 cm</b>.`),
        Q("Exercice 3 · 3)", "Calcule cos ABC, puis donne la mesure de l'angle ABC arrondie au degré.", 1.5,
          `Dans le triangle ABC rectangle en A : cos ABC = ${fr("côté adjacent", "hypoténuse")} = ${fr("AB", "BC")} = ${fr(6, 10)} = <b>0,6</b>.<br>À la calculatrice : ABC = cos⁻¹(0,6) ≈ <b>53°</b>.`),
        Q("Exercice 4 · 1)", "À Yamoussoukro, le club A fait payer 1 500 F la séance. Le club B demande un abonnement de 6 000 F, puis 1 000 F la séance. Calcule le prix de 10 séances dans chaque club.", 1,
          `Club A : 10 × 1 500 = <b>15 000 F</b>. Club B : 6 000 + 10 × 1 000 = <b>16 000 F</b>. Pour 10 séances, A est moins cher.`),
        Q("Exercice 4 · 2)", "On note x le nombre de séances. Exprime f(x), prix au club A, et g(x), prix au club B. Précise la nature de f et de g.", 1.5,
          `f(x) = <b>1 500x</b> : application <b>linéaire</b> (de la forme ax).<br>g(x) = <b>1 000x + 6 000</b> : application <b>affine</b> (de la forme ax + b).`),
        Q("Exercice 4 · 3)", "Résous f(x) = g(x) et interprète.", 1.5,
          `1 500x = 1 000x + 6 000 ⇔ 500x = 6 000 ⇔ x = <b>12</b>.<br>Pour 12 séances, les deux clubs coûtent le même prix : 18 000 F.`),
        Q("Exercice 4 · 4)", "À partir de combien de séances le club B est-il plus avantageux ?", 2,

      ] },
    { id: "maths-b", matiere: "maths", titre: "Mathématiques · Sujet B", duree: "2 h",
      consignes: "La calculatrice scientifique est autorisée. Toutes les réponses doivent être justifiées.",
      questions: [
        Q("Exercice 1 · 1)", `Écris C = ${rac(75)} − 2${rac(12)} + ${rac(27)} sous la forme a${rac(3)}.`, 1.5,
          `${rac(75)} = ${rac("25 × 3")} = 5${rac(3)} ; ${rac(12)} = ${rac("4 × 3")} = 2${rac(3)} ; ${rac(27)} = ${rac("9 × 3")} = 3${rac(3)}.<br>C = 5${rac(3)} − 2 × 2${rac(3)} + 3${rac(3)} = (5 − 4 + 3)${rac(3)} = <b>4${rac(3)}</b>.`),
        Q("Exercice 1 · 2)", `Écris ${fr(6, rac(3))} sans radical au dénominateur.`, 1,

        Q("Exercice 1 · 3)", `Sachant que 1,41 < ${rac(2)} < 1,42, encadre 3 + 2${rac(2)}.`, 1.5,

        Q("Exercice 2", "Au marché de Bouaké, 3 kg de riz et 2 kg de sucre coûtent 2 600 F ; 2 kg de riz et 3 kg de sucre coûtent 2 900 F. Calcule le prix d'un kilogramme de riz et d'un kilogramme de sucre.", 5,
          `<b>Choix des inconnues</b> (0,5 pt) : r = prix d'un kg de riz, s = prix d'un kg de sucre.<br><b>Mise en équations</b> (1 pt) : 3r + 2s = 2 600 et 2r + 3s = 2 900.<br><b>Résolution par combinaison</b> (2 pts) : on multiplie la 1re équation par 3 et la 2e par 2 : 9r + 6s = 7 800 et 4r + 6s = 5 800. On soustrait : 5r = 2 000, donc r = 400. Puis 3 × 400 + 2s = 2 600 ⇔ 2s = 1 400 ⇔ s = 700.<br><b>Vérification</b> (0,5 pt) : 2 × 400 + 3 × 700 = 800 + 2 100 = 2 900 ✓.<br><b>Réponse</b> (1 pt) : le riz coûte <b>400 F le kg</b> et le sucre <b>700 F le kg</b>.`),

        Q("Exercice 3 · 3)", "Détermine une équation de la droite (AB).", 1.5,
          `Coefficient directeur : a = ${fr("4 − 2", "3 − (−1)")} = ${fr(2, 4)} = ${fr(1, 2)}. Avec A : 2 = ${fr(1, 2)} × (−1) + b ⇔ b = ${fr(5, 2)}.<br>Équation : <b>y = ${fr(1, 2)}x + ${fr(5, 2)}</b>. Vérification avec B : ${fr(3, 2)} + ${fr(5, 2)} = 4 ✓.`),
        Q("Exercice 3 · 4)", "Détermine les coordonnées du point D tel que ABCD soit un parallélogramme.", 1,

        Q("Exercice 4 · 1)", "Notes de 25 élèves : 6 (2 élèves), 8 (5), 10 (8), 12 (6), 14 (3), 16 (1). Donne le mode et calcule la moyenne.", 2,
          `<b>Mode</b> : la note la plus fréquente, <b>10</b> (8 élèves).<br><b>Moyenne</b> : ${fr("6×2 + 8×5 + 10×8 + 12×6 + 14×3 + 16×1", 25)} = ${fr("12 + 40 + 80 + 72 + 42 + 16", 25)} = ${fr(262, 25)} = <b>10,48</b>.`),
        Q("Exercice 4 · 2)", "Dresse le tableau des effectifs cumulés croissants et détermine la médiane.", 2,
          `Effectifs cumulés croissants : 6 → 2 ; 8 → 7 ; 10 → 15 ; 12 → 21 ; 14 → 24 ; 16 → 25.<br>25 valeurs : la médiane est la 13e valeur. Or 7 < 13 ≤ 15 : la 13e valeur est 10. <b>Médiane = 10</b>.`),

      ] },
    { id: "pc-a", matiere: "pc", titre: "Physique-Chimie · Sujet A", duree: "2 h",
      consignes: "On prendra g = 10 N/kg. Écris toujours la formule, puis l'application numérique, puis le résultat avec son unité.",
      questions: [
        Q("Chimie · 1", "Lors d'une électrolyse de l'eau, on recueille 15 cm³ de dihydrogène. a) À quelle électrode ? b) Quel volume de dioxygène obtient-on ? c) Écris l'équation-bilan. d) Comment identifier le dioxygène ?", 4,
          `a) Le dihydrogène se dégage à la <b>cathode</b> (électrode reliée à la borne −). (1 pt)<br>b) V(O₂) = V(H₂) ÷ 2 = 15 ÷ 2 = <b>7,5 cm³</b>. (1 pt)<br>c) <b>2 H₂O → 2 H₂ + O₂</b>. (1 pt)<br>d) Il <b>rallume une bûchette incandescente</b>. (1 pt)`),
        Q("Chimie · 2", "Le butane C₄H₁₀ brûle complètement dans le dioxygène. a) Nomme les produits. b) Écris et équilibre l'équation. c) Comment met-on en évidence le CO₂ ? d) Quel danger présente une combustion incomplète ?", 4,
          `a) Dioxyde de carbone (CO₂) et eau (H₂O). (1 pt)<br>b) <b>2 C₄H₁₀ + 13 O₂ → 8 CO₂ + 10 H₂O</b>. Vérification : C : 8 = 8 ; H : 20 = 20 ; O : 26 = 16 + 10 ✓. (1,5 pt)<br>c) Le CO₂ <b>trouble l'eau de chaux</b>. (0,5 pt)<br>d) Elle produit du <b>monoxyde de carbone (CO)</b>, gaz toxique et mortel sans odeur, et de la suie. Il faut aérer. (1 pt)`),
        Q("Physique · 1", "Un ouvrier soulève un sac de ciment de 50 kg à une hauteur de 3 m en 10 s. a) Calcule le poids du sac. b) Calcule le travail effectué. c) Calcule la puissance. d) Quelle est l'énergie potentielle du sac en haut (sol = référence) ?", 5,
          `a) P = m × g = 50 × 10 = <b>500 N</b>. (1 pt)<br>b) W = F × h = 500 × 3 = <b>1 500 J</b>. (1,5 pt)<br>c) P = W ÷ t = 1 500 ÷ 10 = <b>150 W</b>. (1,5 pt)<br>d) Ep = m × g × h = 50 × 10 × 3 = <b>1 500 J</b> : le travail fourni est stocké sous forme d'énergie potentielle. (1 pt)`),
        Q("Physique · 2", "Un fer à repasser porte l'indication « 220 V – 1 100 W ». a) Que signifient ces indications ? b) Calcule l'intensité du courant. c) Calcule l'énergie consommée en 30 min, en kWh. d) Calcule le coût si le kWh coûte 80 F. e) Calcule la résistance de son élément chauffant.", 5,
          `a) 220 V : tension nominale ; 1 100 W : puissance nominale. (1 pt)<br>b) P = U × I ⇒ I = ${fr("P", "U")} = ${fr("1 100", 220)} = <b>5 A</b>. (1 pt)<br>c) E = P × t = 1,1 kW × 0,5 h = <b>0,55 kWh</b>. (1 pt)<br>d) Coût = 0,55 × 80 = <b>44 F</b>. (1 pt)<br>e) U = R × I ⇒ R = ${fr("U", "I")} = ${fr(220, 5)} = <b>44 Ω</b>. (1 pt)`),

      ] },
    { id: "svt-a", matiere: "svt", titre: "SVT · Sujet A", duree: "2 h",

        Q("Restitution · 3", "Cite les trois modes de transmission du VIH.", 3,
          `1) La voie <b>sexuelle</b> (rapports non protégés). 2) La voie <b>sanguine</b> (objets souillés, sang contaminé). 3) La transmission de la <b>mère à l'enfant</b> (grossesse, accouchement, allaitement). (1 pt chacun)`),
        Q("Documents · 1", "Analyse les résultats des tubes 1 et 2.", 3,
          `<b>Tube 1</b> (sans salive) : l'eau iodée reste bleu-violet → l'amidon est toujours là ; Fehling négatif → pas de sucre réducteur. (1,5 pt)<br><b>Tube 2</b> (avec salive à 37 °C) : l'eau iodée ne colore plus → l'amidon a disparu ; Fehling rouge brique → un sucre réducteur (maltose) est apparu. (1,5 pt)`),

    { id: "hg-a", matiere: "hg", titre: "Histoire-Géographie · Sujet A", duree: "2 h",

      document: doc("Document 1 (Histoire)", `<p style="font-style:italic">« Article premier : Le travail forcé ou obligatoire est interdit de façon absolue dans les territoires d'outre-mer. »</p><p style="font-size:14px">Loi n° 46-645 du 11 avril 1946, dite loi Houphouët-Boigny, votée par l'Assemblée nationale française.</p>`) +
        doc("Document 2 (Géographie)", `<p style="font-style:italic">« Premier producteur mondial de cacao, la Côte d'Ivoire tire de cette culture une grande part de ses recettes d'exportation. Le 1er septembre 2026, le prix garanti au planteur a été fixé à 1 200 F CFA le kilogramme, contre 2 800 F CFA la campagne précédente, à cause de la baisse des cours mondiaux. »</p><p style="font-size:14px">D'après la presse ivoirienne, septembre 2026.</p>`),

    { id: "fr-resume", matiere: "francais", titre: "Français · Résumé de texte argumentatif", duree: "2 h",
      consignes: "Résume ce texte au quart de sa longueur : le texte compte 267 mots, ton résumé doit donc faire environ 67 mots (entre 60 et 74 mots avec la marge de 10 %). Respecte l'ordre des idées et le système d'énonciation. Indique le nombre de mots à la fin.",
      document: doc("Texte (environ 300 mots)", `<p>Aujourd'hui, beaucoup de jeunes passent plus de temps devant leur téléphone que devant leurs livres. Pourtant, la lecture reste irremplaçable. Nous devons donc réapprendre à lire.</p><p>D'abord, la lecture enrichit notre langue. En lisant, nous découvrons des mots nouveaux, des tournures de phrases variées et une orthographe correcte. L'élève qui lit régulièrement écrit mieux et s'exprime plus facilement, à l'oral comme à l'écrit. Les meilleurs résultats aux examens appartiennent souvent à ceux qui lisent.</p><p>Ensuite, lire nous ouvre au monde. Un roman nous fait voyager dans d'autres pays et d'autres époques ; un journal nous informe de ce qui se passe autour de nous. Sans quitter notre quartier, nous rencontrons d'autres cultures et d'autres façons de penser. La lecture développe ainsi notre esprit critique et notre tolérance.</p><p>Enfin, la lecture est un loisir qui apaise. Dans un monde bruyant où les écrans nous sollicitent sans cesse, un livre nous offre un moment de calme et de concentration. Il nous apprend la patience, alors que les vidéos courtes nous habituent à tout vouloir tout de suite.</p><p>Certes, les livres coûtent cher et les bibliothèques sont rares. Mais on peut échanger des livres entre amis, lire sur son téléphone des ouvrages gratuits ou fréquenter le centre culturel de sa ville. Le problème n'est donc pas tant le manque de livres que le manque d'habitude.</p><p>Il appartient ainsi aux parents, aux enseignants et aux jeunes eux-mêmes de redonner à la lecture la place qu'elle mérite. Une nation qui lit est une nation qui progresse.</p>`),
      questions: [
        Q("1 · Comprendre", "Dégage le thème, la thèse et le plan du texte (idées essentielles, dans l'ordre).", 4,
          `<b>Thème</b> : la lecture chez les jeunes. <b>Thèse</b> : la lecture reste irremplaçable, il faut réapprendre à lire.<br><b>Idées dans l'ordre</b> : 1) la lecture enrichit la langue (vocabulaire, orthographe, expression, réussite) ; 2) elle ouvre au monde (voyages, informations, cultures, esprit critique) ; 3) elle apaise et apprend la patience face aux écrans ; 4) objection : les livres sont chers, mais on peut échanger, lire gratuitement, aller au centre culturel ; 5) conclusion : parents, enseignants et jeunes doivent redonner sa place à la lecture.`),
        Q("2 · Résumer", "Rédige ton résumé (environ 67 mots, entre 60 et 74).", 16,
          `<b>Résumé modèle (68 mots)</b> :<br><span style="font-style:italic">« Bien que les jeunes préfèrent leur téléphone, la lecture demeure indispensable. Elle améliore notre vocabulaire, notre orthographe et notre expression, gages de réussite. Elle nous fait découvrir d'autres pays et d'autres cultures, développant notre esprit critique. Elle nous apporte aussi calme et patience face aux écrans. Si les livres sont chers, on peut les échanger ou les lire gratuitement. Réhabilitons donc la lecture, source de progrès. »</span><br><br><b>Grille de correction</b> : fidélité aux idées et à leur ordre (8 pts) · reformulation personnelle, sans recopier (3 pts) · enchaînement logique avec des connecteurs (2 pts) · respect du nombre de mots (1 pt) · orthographe et syntaxe (2 pts).<br><i>Pièges : ne pas écrire « l'auteur dit que », ne pas donner son avis, ne pas recopier des phrases entières, garder le « nous » du texte.</i>`)

  const hautParleur = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
  const voixOk = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
  let boutonParle = null;

  function parler(texte, langue, bouton) {
    if (!voixOk) return;
    const synth = window.speechSynthesis;
    const memeBouton = boutonParle === bouton;
    synth.cancel();
    if (boutonParle) { boutonParle.dataset.etat = ""; majBouton(boutonParle); boutonParle = null; }
    if (memeBouton) return;
    const u = new SpeechSynthesisUtterance(texte);
    u.lang = langue; u.rate = Number(bouton.dataset.vitesse) || (langue.startsWith("en") ? 0.85 : 0.95);
    const v = synth.getVoices().find(x => x.lang && x.lang.replace("_", "-").toLowerCase().startsWith(langue.slice(0, 2)));
    if (v) u.voice = v;
    u.onend = u.onerror = () => { if (boutonParle === bouton) { bouton.dataset.etat = ""; majBouton(bouton); boutonParle = null; } };
    boutonParle = bouton; bouton.dataset.etat = "lecture"; majBouton(bouton);
    synth.speak(u);
  }
  const btnEcoute = (texte, langue, libelle, mini, vitesse) => voixOk
    ? `<button type="button" class="ecouter${mini ? " mini" : ""}" data-parle="${encodeURIComponent(texte)}" data-langue="${langue}" data-libelle="${libelle}"${vitesse ? ` data-vitesse="${vitesse}"` : ""} aria-label="${libelle}">${hautParleur}<span>${mini ? "" : " " + libelle}</span></button>` : "";

  // =========================================================
  // Sessions d'exercices
  // =========================================================
  function fabriquer(gens, n) {
    const qs = []; let pile = [];
    while (qs.length < n) { if (!pile.length) pile = melanger(gens); qs.push(pile.pop()()); }
    return qs;
  }
  function lancerSession(chap, niv, rapide) {
    session = { type: "niveau", chap, niv, rapide, questions: fabriquer(niv.gens, niv.n), i: 0, bonnes: 0, xp: 0, valide: false };
    aller("exercice");
  }
  function lancerMission() {
    // 6 questions sur les compétences les plus faibles, 4 sur la leçon du moment
    const dispos = [];
    chapitres().forEach(c => { if (c.id === "bases" || meilleur(c.id, c.niveaux[0].id) || c.id === leconDuMoment()) c.niveaux.forEach(n => n.gens.forEach(g => { if (!dispos.includes(g)) dispos.push(g); })); });
    const faiblesse = g => { const q = g(); const s = etat.comp[q.comp]; return s ? s.ok / s.total : 0.5; };
    const tries = melanger(dispos).map(g => [g, faiblesse(g) + Math.random() * 0.25]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
    const moment = chapitreDe(leconDuMoment());
    const gensMoment = moment.niveaux.slice(0, 2).flatMap(n => n.gens);
    const autres = AUTRES.flatMap(M => M.chapitres).filter(c => c.special !== "dictee" && (meilleur(c.id, c.niveaux[0].id) || c.id === pcDuMoment())).flatMap(c => c.niveaux[0].gens);
    const qs = fabriquer(tries.slice(0, 4), 4).concat(fabriquer(gensMoment, 2), fabriquer(autres.length ? autres : chapitreDe(pcDuMoment()).niveaux[0].gens, 2), fabriquer(CHAP_THEMES.flatMap(c => c.niveaux[0].gens), 2));
    session = { type: "mission", titre: "Mission du jour", questions: melanger(qs), i: 0, bonnes: 0, xp: 0, valide: false };
    aller("exercice");
  }

  // ---------- Une question ----------
  let caseActive = 0;
  function afficherQuestion() {
    const s = session, q = s.questions[s.i];

    let zone = "";

      zone = `<textarea id="texte-rep" class="texte-rep" rows="3" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" aria-label="Écris la phrase dictée" placeholder="Écris la phrase ici…"></textarea>`;
    } else if (q.type === "qcm") {
      zone = `<div class="choix" role="group" aria-label="Choisis une réponse">${q.choix.map((c, i) => `<button type="button" data-choix="${i}" aria-pressed="false">${c}</button>`).join("")}</div>`;
    } else {
      let cases = "";
      if (q.type === "nombre") cases = `<input class="case" id="case-0" inputmode="none" autocomplete="off" aria-label="Ta réponse">`;
      else if (q.type === "deux") cases = `x = <input class="case" id="case-0" inputmode="none" autocomplete="off" aria-label="Première solution"> ou x = <input class="case" id="case-1" inputmode="none" autocomplete="off" aria-label="Deuxième solution">`;
      else cases = q.modele.map((t, i) => (t ? `<span>${t}</span>` : "") + (i < q.modele.length - 1 ? `<input class="case petite" id="case-${i}" inputmode="none" autocomplete="off" aria-label="Case ${i + 1}">` : "")).join("");
      zone = `<div class="reponse">${cases}</div>
        <div class="pave" role="group" aria-label="Pavé numérique">
          ${["7", "8", "9", "⌫", "4", "5", "6", "−", "1", "2", "3", "/", "0", ",", "→"].map(k => `<button type="button" data-touche="${k}" class="${"⌫−/,→".includes(k) ? "gris" : ""}" aria-label="${{ "⌫": "Effacer", "−": "Moins", "/": "Fraction", ",": "Virgule", "→": "Case suivante" }[k] || k}">${k}</button>`).join("")}
          <button type="button" data-touche="ok" style="background:var(--bleu);color:#fff">OK</button>
        </div>`;
    }
    vue.innerHTML = `<section class="ecran">
      <div class="exo-haut"><button type="button" class="quitter" id="quitter" aria-label="Quitter">✕</button>
        <div class="progress"><i style="width:${s.i / s.questions.length * 100}%"></i></div>
        <span class="exo-titre">${s.i + 1}/${s.questions.length}</span></div>
      <span class="exo-titre">${titre}${q.defi ? ' · <span class="pastille">Défi</span>' : ""}</span>
      ${q.figure || ""}
      <div class="question">${q.enonce}</div>
      ${zone}
      <div id="indice" class="indice cache" aria-live="polite"></div>
      <p class="message" id="message" aria-live="polite"></p>
      <div id="retour-exo"></div>

    </section>`;
    s.valide = false;
    vue.querySelector("#quitter").addEventListener("click", () => aller(s.type === "mission" ? "accueil" : s.chap.ecran || "chapitre", s.chap && s.chap.id));
    vue.querySelector("#verifier").addEventListener("click", () => s.valide ? suivante() : verifier());
    vue.querySelector("#btn-indice").addEventListener("click", e => {

      if (q.type === "qcm") {
        const fausses = [...vue.querySelectorAll("[data-choix]")].filter(b => q.choix[+b.dataset.choix] !== q.reponse);
        melanger(fausses).slice(0, Math.max(0, fausses.length - 1)).forEach(b => { b.classList.add("cache"); b.setAttribute("aria-pressed", "false"); });
        if (fausses.length > 1) texte = "J'ai retiré des réponses fausses. " + "<br>" + texte;
      }
      const box = vue.querySelector("#indice"); box.innerHTML = texte + '<p style="font-size:13px;color:var(--encre-2);margin-top:6px">Avec un indice, une bonne réponse rapporte 5 points au lieu de 10.</p>'; box.classList.remove("cache");
    });
    brancherEcoute();
    if (q.type === "texte") {
      const b = vue.querySelector("[data-parle]"); if (b) setTimeout(() => { if (session === s && !s.valide) b.click(); }, 350);
    } else if (q.type === "qcm") {
      vue.querySelectorAll("[data-choix]").forEach(b => b.addEventListener("click", () => { if (s.valide) return; vue.querySelectorAll("[data-choix]").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); }));
    } else {
      const cases = [...vue.querySelectorAll(".case")];
      caseActive = 0; cases[0].classList.add("active");
      cases.forEach((c, i) => {
        c.addEventListener("focus", () => { caseActive = i; cases.forEach(x => x.classList.toggle("active", x === c)); });
        c.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); s.valide ? suivante() : verifier(); } });
      });
      vue.querySelectorAll("[data-touche]").forEach(b => b.addEventListener("click", () => touche(b.dataset.touche, cases)));
      if (window.matchMedia("(hover:hover)").matches) cases[0].focus();
    }
  }
  function touche(k, cases) {
    if (session.valide) { if (k === "ok") suivante(); return; }
    const c = cases[caseActive];
    if (k === "ok") return verifier();
    if (k === "→") { caseActive = (caseActive + 1) % cases.length; cases.forEach((x, i) => x.classList.toggle("active", i === caseActive)); return; }
    if (k === "⌫") c.value = c.value.slice(0, -1);
    else if (k === "−") c.value = c.value.startsWith("−") ? c.value.slice(1) : "−" + c.value;
    else if (c.value.length < 8) c.value += k;
  }
  function verifier() {
    const s = session, q = s.questions[s.i], msg = vue.querySelector("#message");
    let ok, presque = false, dictee = null, taRep = "";
    const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    if (q.type === "texte") {
      const saisie = vue.querySelector("#texte-rep").value.trim();
      if (!saisie) { msg.textContent = "Écris la phrase avant de vérifier."; return; }
      dictee = comparerDictee(q.reponse, saisie); ok = dictee.erreurs === 0; taRep = esc(saisie);
      vue.querySelector("#texte-rep").readOnly = true;
    } else if (q.type === "qcm") {
      const choisi = vue.querySelector('[data-choix][aria-pressed="true"]');
      if (!choisi) { msg.textContent = "Choisis une réponse."; return; }
      ok = q.choix[+choisi.dataset.choix] === q.reponse; taRep = q.choix[+choisi.dataset.choix];
      vue.querySelectorAll("[data-choix]").forEach(b => { const juste = q.choix[+b.dataset.choix] === q.reponse; if (juste) b.classList.add("juste"); else if (b === choisi) b.classList.add("faux"); });
    } else {
      const brut = [...vue.querySelectorAll(".case")].map(c => esc(c.value.trim()));
      const v = [...vue.querySelectorAll(".case")].map(c => lireNombre(c.value));
      taRep = q.type === "nombre" ? brut[0] : q.type === "deux" ? `x = ${brut[0]} ou x = ${brut[1]}` : q.modele.map((t, i) => t + (i < brut.length ? `<b>${brut[i]}</b>` : "")).join("");
      if (v.some(x => isNaN(x))) { msg.textContent = "Écris un nombre dans chaque case (par exemple 3, −2, 7/2 ou 2,5)."; return; }
      if (q.type === "nombre") ok = egal(v[0], q.reponse);
      else if (q.type === "deux") ok = (egal(v[0], q.reponse[0]) && egal(v[1], q.reponse[1])) || (egal(v[0], q.reponse[1]) && egal(v[1], q.reponse[0]));
      else if (q.racine) {
        ok = egal(v[0], q.reponse[0]) && egal(v[1], q.reponse[1]);
        if (!ok && v[1] > 0 && egal(v[0] * Math.sqrt(v[1]), q.reponse[0] * Math.sqrt(q.reponse[1]))) presque = true;
      } else ok = v.every((x, i) => egal(x, q.reponse[i]));
    }
    msg.textContent = "";
    s.valide = true;
    const pave = vue.querySelector(".pave"); if (pave) pave.classList.add("cache");
    const st = etat.comp[q.comp] || { ok: 0, total: 0 };
    st.total++; if (ok) st.ok++; st.dernier = aujourdhui(); etat.comp[q.comp] = st;
    if (ok) { s.bonnes++; const g = (q.aIndice ? 5 : 10) + (q.defi ? 10 : 0) + (s.niv && s.niv.id === "maitrise" ? 5 : 0); s.xp += g; etat.bonnes++; }
    const bravo = ["Bravo !", "Excellent !", "Juste !", "Parfait !", "Bien joué, " + PRENOM + " !"];
    const aide = AIDE_COMP[q.comp];
    const rappel = q.rappel ? `<b>${q.rappel.titre}</b> — ${q.rappel.texte}` : aide ? aide.indice : "";
    const bonne = dictee ? dictee.rendu : (q.affiche || q.reponse);
    const sections = (!ok ? `<div class="sec"><span>Ta réponse</span><p class="ta-rep">${taRep || "—"}</p></div><div class="sec"><span>Bonne réponse</span><p class="bonne-rep">${bonne}</p></div>` : "")
      + `<div class="sec"><span>Correction pas à pas</span><div class="expl">${q.explication}</div></div>`
      + (rappel ? `<div class="sec"><span>Rappel de cours</span><p>${rappel}</p></div>` : "")
      + (aide && aide.piege ? `<div class="sec piege-sec"><span>Piège à éviter</span><p>${aide.piege}</p></div>` : "");
    vue.querySelector("#retour-exo").innerHTML = ok
      ? `<div class="retour-exo bien"><h3>${parmi(bravo)}</h3><details><summary style="cursor:pointer;font-weight:800;color:var(--vert)">Voir la correction détaillée</summary>${sections}</details></div>`
      : `<div class="retour-exo mal"><h3>${presque ? "Presque : c'est juste, mais pas simplifié" : dictee ? dictee.erreurs + " faute" + (dictee.erreurs > 1 ? "s" : "") : "Pas tout à fait"}</h3>${sections}</div>`;
    const bi = vue.querySelector("#btn-indice"); if (bi) bi.classList.add("cache");
    const b = vue.querySelector("#verifier"); b.textContent = s.i + 1 < s.questions.length ? "Continuer" : "Voir mon résultat"; b.classList.toggle("vert", ok);
    sauver();
    b.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function suivante() {
    const s = session;
    s.i++;
    if (s.i < s.questions.length) afficherQuestion();
    else terminer();
  }
  function terminer() {
    const s = session, n = s.questions.length;
    etat.xp += s.xp; etat.sessions++;
    // Série de jours
    const j = aujourdhui();
    if (etat.dernierJour !== j) { etat.serie = etat.dernierJour === hier() ? etat.serie + 1 : 1; etat.dernierJour = j; }
    if (s.bonnes === n && n >= 5) etat.sansFaute = true;
    let debloque = null;
    if (s.type === "mission") etat.missions[j] = true;
    else {
      const cle = s.chap.id + "/" + s.niv.id, avant = reussi(s.chap, s.niv);
      etat.meilleurs[cle] = Math.max(etat.meilleurs[cle] || 0, s.bonnes);
      if (s.rapide && s.bonnes >= s.niv.seuil) s.chap.niveaux.forEach(nv => { if (nv.id !== "defi") etat.meilleurs[s.chap.id + "/" + nv.id] = Math.max(etat.meilleurs[s.chap.id + "/" + nv.id] || 0, nv.seuil); });
      if (!avant && reussi(s.chap, s.niv)) {
        const i = s.chap.niveaux.indexOf(s.niv);
        debloque = s.chap.niveaux[i + 1] || null;
      }
    }
    s.nouveauxBadges = verifierBadges();
    s.debloque = debloque;
    sauver();
    aller("fin");
  }
  function afficherFin() {
    const s = session, n = s.questions.length, pct = s.bonnes / n;
    const et = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.4 ? 1 : 0;
    const message = pct === 1 ? "Sans faute, champion !" : pct >= 0.8 ? "Très bien, continue comme ça !" : pct >= 0.5 ? "C'est bien, encore un effort." : "Relis la fiche de cours et réessaie, tu vas y arriver.";
    const reussite = s.type === "niveau" && s.bonnes >= s.niv.seuil;
    vue.innerHTML = `<section class="ecran fin">
      <h2>${s.type === "mission" ? "Mission terminée" : s.chap.ecran ? "Quiz : " + s.chap.titre : s.niv.nom}</h2>
      <div class="etoiles" aria-label="${et} étoile(s) sur 3">${"★".repeat(et)}${"☆".repeat(3 - et)}</div>
      <div class="score">${s.bonnes}/${n}</div>
      <p style="font-weight:800">${message}</p>
      <div class="gain"><span>+${s.xp} points</span><span>${flamme.replace('<svg', '<svg style="width:16px;height:16px;vertical-align:-2px;color:var(--orange)"')} ${etat.serie} jour${etat.serie > 1 ? "s" : ""}</span></div>
      ${s.debloque ? `<div class="badge-nouveau">Nouveau niveau débloqué : ${s.debloque.nom}</div>` : ""}
      ${s.type === "niveau" && !reussite ? `<p style="color:var(--encre-2)">Il faut ${s.niv.seuil}/${n} pour réussir ce niveau.</p>` : ""}
      ${s.nouveauxBadges.map(b => `<div class="badge-nouveau">Badge gagné : ${b.nom}</div>`).join("")}
      <div class="actions">
        ${s.debloque ? `<button type="button" class="bouton vert" id="suivant">Niveau suivant : ${s.debloque.nom}</button>` : ""}
        <button type="button" class="bouton second" id="refaire">${s.type === "mission" ? "Une autre mission" : "Recommencer"}</button>
        <button type="button" class="bouton second" id="retour-fin">${s.type === "mission" ? "Retour à l'accueil" : s.chap.ecran ? "Retour au thème" : "Retour à la leçon"}</button>
      </div></section>`;
    if (s.debloque) vue.querySelector("#suivant").addEventListener("click", () => lancerSession(s.chap, s.debloque));
    vue.querySelector("#refaire").addEventListener("click", () => s.type === "mission" ? lancerMission() : lancerSession(s.chap, s.niv, s.rapide));
    vue.querySelector("#retour-fin").addEventListener("click", () => s.type === "mission" ? aller("accueil") : aller(s.chap.ecran || "chapitre", s.chap.id));
  }

  // =========================================================
  // Progrès
  // =========================================================
  function afficherProgres() {
    const r = rang();
    const comps = Object.entries(etat.comp).filter(([, s]) => s.total >= 1).map(([id, s]) => ({ id, nom: COMPETENCES[id] || id, pct: Math.round(s.ok / s.total * 100), total: s.total })).sort((a, b) => a.pct - b.pct);
    const faibles = comps.filter(c => c.pct < 60 && c.total >= 3);
    const couleur = p => p >= 80 ? "var(--vert)" : p >= 60 ? "var(--or)" : "var(--rouge)";
    vue.innerHTML = `<section class="ecran"><h2>Mes progrès</h2>
      <div class="stats"><div class="stat"><b>${etat.xp}</b><small>points</small></div><div class="stat"><b>${serieActuelle()}</b><small>jours d'affilée</small></div><div class="stat"><b>${etat.bonnes}</b><small>bonnes réponses</small></div></div>
      <div class="carte" style="display:grid;gap:6px"><span class="etiquette">Rang</span><b style="font-family:var(--titre);font-size:22px">Niveau ${r.niveau} · ${r.nom}</b>
        <div class="barre-xp"><i style="width:${r.pct}%"></i></div><small style="color:var(--encre-2);font-weight:700">${r.suivant ? r.reste + " points avant « " + r.suivant + " »" : "Rang maximum atteint !"}</small></div>
      <div class="carte" style="display:grid;gap:10px"><span class="etiquette">Par matière</span>
        ${MATIERES.map(m => { const p = pctMatiere(m); return `<div class="ligne-comp"><span>${m.nom}</span><span class="mini"><i style="width:${p}%;background:${m.couleur}"></i></span><span>${p} %</span></div>`; }).join("")}</div>
      ${faibles.length ? `<div class="carte" style="display:grid;gap:10px;border-color:var(--rouge)"><span class="etiquette" style="color:var(--rouge)">À retravailler</span>
        ${faibles.map(c => `<div class="ligne-comp"><span>${c.nom}</span><span class="mini"><i style="width:${c.pct}%;background:${couleur(c.pct)}"></i></span><span>${c.pct} %</span></div>`).join("")}
        <p style="color:var(--encre-2);font-size:14px">La mission du jour te donne surtout ces exercices-là.</p></div>` : ""}
      <div class="carte" style="display:grid;gap:10px"><span class="etiquette">Réussite par compétence</span>
        ${comps.length ? comps.map(c => `<div class="ligne-comp"><span>${c.nom}</span><span class="mini"><i style="width:${c.pct}%;background:${couleur(c.pct)}"></i></span><span>${c.pct} %</span></div>`).join("") : `<p style="color:var(--encre-2)">Fais ta première mission pour voir tes résultats ici.</p>`}</div>
      <span class="etiquette">Badges (${etat.badges.length}/${BADGES.length})</span>
      <div class="badges">${BADGES.map(b => `<div class="badge${etat.badges.includes(b.id) ? " gagne" : ""}"><span class="medaille">${b.lettre}</span>${b.nom}</div>`).join("")}</div>
      <div class="carte" style="display:grid;gap:12px"><span class="etiquette">Réglages</span>
        <div class="reglage"><span>Taille du texte</span><div class="segments" role="group" aria-label="Taille du texte">${[["petit", "A−"], ["normal", "A"], ["grand", "A+"], ["tresgrand", "A++"]].map(([v, l]) => `<button type="button" data-taille="${v}" aria-pressed="${(etat.reglages || {}).taille === v || (!(etat.reglages || {}).taille && v === "normal")}">${l}</button>`).join("")}</div></div>
        <div class="reglage"><span>Thème</span><div class="segments" role="group" aria-label="Thème">${[["auto", "Auto"], ["light", "Clair"], ["dark", "Sombre"]].map(([v, l]) => `<button type="button" data-theme-choix="${v}" aria-pressed="${((etat.reglages || {}).theme || "auto") === v}">${l}</button>`).join("")}</div></div>
      </div>
      <div class="carte" style="display:grid;gap:8px"><span class="etiquette">Recommencer à zéro</span>
        <p style="color:var(--encre-2);font-size:14px">Efface tous les points, badges et résultats de ce téléphone.</p>
        <button type="button" class="bouton second" id="effacer" style="border-color:var(--rouge);color:var(--rouge)">Tout effacer</button></div>
      <p style="text-align:center;color:var(--encre-2);font-size:13px">Application de ${NOM_COMPLET} · programme officiel de 3e, Côte d'Ivoire</p>
    </section>`;
    vue.querySelectorAll("[data-taille]").forEach(b => b.addEventListener("click", () => { etat.reglages = Object.assign({}, etat.reglages, { taille: b.dataset.taille }); sauver(); appliquerReglages(); afficherProgres(); }));
    vue.querySelectorAll("[data-theme-choix]").forEach(b => b.addEventListener("click", () => { etat.reglages = Object.assign({}, etat.reglages, { theme: b.dataset.themeChoix }); sauver(); appliquerReglages(); afficherProgres(); }));
    const eff = vue.querySelector("#effacer");
    eff.addEventListener("click", () => {
      if (eff.dataset.confirmer !== "1") { eff.dataset.confirmer = "1"; eff.textContent = "Touche encore pour confirmer"; setTimeout(() => { eff.dataset.confirmer = ""; eff.textContent = "Tout effacer"; }, 3500); return; }
      etat = vide(); sauver(); aller("accueil");
    });
  }

  function appliquerReglages() {
    const r = etat.reglages || {};
    document.documentElement.style.setProperty("--zoom", { petit: 0.9, normal: 1, grand: 1.12, tresgrand: 1.25 }[r.taille] || 1);
    if (r.theme === "light" || r.theme === "dark") document.documentElement.setAttribute("data-theme", r.theme);
    else if (r.theme === "auto") document.documentElement.removeAttribute("data-theme");
  }
  appliquerReglages();
  aller("accueil");
  if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname)) {
    try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
  }
})();
</script>
